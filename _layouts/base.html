<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{% if page.title %}{{ page.title }} · {% endif %}Eduardo Sanches</title>
  <meta name="description" content="{{ page.excerpt | default: 'Blog de Eduardo Sanches.' | strip_html | normalize_whitespace | truncate: 160 }}" />

  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="color-scheme" content="dark" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://use.typekit.net" crossorigin />
  <link rel="stylesheet" href="https://use.typekit.net/qjf5rzi.css" />
  <link rel="stylesheet" href="{{ '/assets/site-cursor.css' | relative_url }}" />
  <script src="{{ '/assets/site-cursor.js' | relative_url }}" defer></script>

  <style>
    :root {
      /* Type */
      --font-display: 'anzeigen-grotesk', 'Anton', sans-serif;
      --font-body:    'corporate-a', 'Instrument Serif', Georgia, serif;
      --font-sans:    'corporate-s', -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, monospace;
      /* Colour */
      --ink:       #0a0a0b;        /* page background       */
      --panel:     #121214;        /* raised surface        */
      --paper:     #f5f6f7;        /* primary text          */
      --soft:      #c7c7cc;        /* secondary text        */
      --grey:      #9a9a9f;        /* tertiary / meta text  */
      --paper-rgb: 245, 246, 247;  /* for translucent fills */
      --line:      rgba(var(--paper-rgb), 0.12);  /* hairlines */
      /* Shape & layout */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --reading:   680px;
      /* Spacing (4-based scale) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ink) radial-gradient(120% 80% at 50% -10%, #18181b 0%, var(--ink) 58%) no-repeat;
      color: var(--paper);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid rgba(var(--paper-rgb), 0.7); outline-offset: 3px; border-radius: 2px; }

    .masthead {
      max-width: var(--reading);
      margin: 0 auto;
      padding: 30px 22px 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      /* wayfinding is functional, not brand — mono like dates/meta */
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    .masthead a { text-decoration: none; color: var(--grey); transition: color 0.2s ease; }
    .masthead a:hover { color: var(--paper); }
    .masthead .sep { color: var(--grey); }
    .masthead .current { color: var(--paper); font-weight: 500; }

    .wrap { max-width: var(--reading); margin: 0 auto; padding: 40px 22px 120px; }

    /* ---- Blog index ---- */
    .post-item { padding: 26px 0; border-top: 1px solid var(--line); }
    .post-item:first-child { border-top: none; padding-top: 6px; }
    .post-item time { font-family: var(--font-mono); font-size: 12px; color: var(--grey); }
    .post-item h2 {
      font-family: var(--font-display);
      font-weight: 400;
      font-synthesis: none;
      font-size: 29px;
      line-height: 1.04;
      letter-spacing: 0.018em;
      text-transform: uppercase;
      margin: 8px 0 10px;
    }
    .post-item h2 a { text-decoration: none; }
    .post-item h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .post-item .excerpt { color: var(--soft); margin: 0; }
    .empty { color: var(--grey); }

    /* ---- Single post ---- */
    .post time { font-family: var(--font-mono); font-size: 12px; color: var(--grey); }
    .post h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-synthesis: none;
      font-size: clamp(38px, 8vw, 58px);
      line-height: 0.98;
      letter-spacing: 0.015em;
      text-transform: uppercase;
      margin: 10px 0 30px;
    }
    .content { font-size: 19px; }
    .content > * + * { margin-top: 1.2em; }
    .content h2 {
      font-family: var(--font-display);
      font-weight: 400;
      font-synthesis: none;
      font-size: 32px;
      line-height: 1.04;
      letter-spacing: 0.018em;
      text-transform: uppercase;
      margin-top: 1.8em;
    }
    .content h3 {
      font-family: var(--font-body);
      font-style: italic;
      font-weight: 400;
      font-size: 25px;
      line-height: 1.2;
      margin-top: 1.5em;
    }
    .content a { color: var(--paper); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(var(--paper-rgb), 0.4); }
    .content a:hover { text-decoration-color: var(--paper); }
    .content img { max-width: 100%; height: auto; border-radius: var(--radius-md); display: block; }
    .content iframe { width: 100%; aspect-ratio: 16 / 9; height: auto; border: 0; border-radius: var(--radius-md); display: block; }
    .content video { max-width: 100%; height: auto; border-radius: var(--radius-md); display: block; }
    .content figure { margin: 1.6em 0; }
    .content figcaption { margin-top: 8px; font-style: italic; font-size: 15px; color: var(--grey); text-align: center; }
    .content blockquote { margin: 1.4em 0; padding: 4px 0 4px 20px; border-left: 2px solid var(--line); color: var(--soft); font-style: italic; }
    .content code { font-family: var(--font-mono); font-size: 0.88em; background: rgba(var(--paper-rgb), 0.08); padding: 2px 6px; border-radius: var(--radius-sm); }
    .content pre { background: rgba(var(--paper-rgb), 0.05); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); overflow: auto; }
    .content pre code { background: none; padding: 0; }
    .content ul, .content ol { padding-left: 1.3em; }
    .content li + li { margin-top: 0.4em; }
    .content hr { border: none; border-top: 1px solid var(--line); margin: 2.4em 0; }

    .back {
      display: inline-block;
      margin-top: 52px;
      /* functional link — mono, same voice as the masthead */
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--grey);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .back:hover { color: var(--paper); }

    /* Jump-links land a little below the top edge */
    .content h2[id], .content h3[id] { scroll-margin-top: 28px; }

    /* Post table of contents — fixed on the left, desktop only */
    .toc { display: none; }
    @media (min-width: 1200px) {
      .toc {
        display: block;
        position: fixed;
        top: 120px;
        left: 40px;
        width: 200px;
        max-height: calc(100vh - 170px);
        overflow: auto;
      }
      .toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
      .toc a {
        display: block; padding: 6px 0 6px 26px; margin-left: -1px;
        border-left: 1px solid transparent;
        color: var(--soft); text-decoration: none;
        font-family: var(--font-sans);
        font-size: 14px; font-weight: 400; line-height: 1.35;
        transition: color 0.15s ease, border-color 0.15s ease;
      }
      .toc a.top { padding-left: 14px; padding-bottom: 8px; font-weight: 700; font-size: 15px; line-height: 1.25; color: var(--soft); }
      .toc a.sub { padding-left: 40px; font-size: 14px; font-weight: 400; color: var(--grey); }
      .toc a:hover { color: var(--soft); }
      .toc a.active { color: var(--paper); border-left-color: var(--paper); }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="masthead" aria-label="Caminho">
    <a href="/">eduardo sanches</a>
    <span class="sep">/</span>
    {% if page.layout == 'post' %}
    <a href="/blog/">blog</a>
    <span class="sep">/</span>
    <span class="current" aria-current="page">{{ page.title }}</span>
    {% else %}
    <span class="current" aria-current="page">blog</span>
    {% endif %}
  </header>

  <main class="wrap">
    {{ content }}
  </main>
</body>
</html>
