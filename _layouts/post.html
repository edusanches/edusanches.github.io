---
layout: base
---
<aside class="toc" id="toc" aria-label="Conteúdo do post"></aside>

<article class="post">
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>
  <h1 id="post-top">{{ page.title }}</h1>
  <div class="content">
    {{ content }}
  </div>
</article>

<a class="back" href="/blog/">← voltar ao blog</a>

<script>
(function () {
  var content = document.querySelector(".post .content");
  var toc = document.getElementById("toc");
  var titleEl = document.querySelector(".post h1");
  if (!content || !toc || !titleEl) return;
  var heads = content.querySelectorAll("h2, h3");
  if (heads.length < 2) { toc.remove(); return; }   // not worth a TOC

  var ul = document.createElement("ul");
  var byId = {};
  var observed = [];

  function addItem(el, cls) {
    if (!el.id) {
      el.id = el.textContent.toLowerCase().trim()
        .replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");
    }
    var a = document.createElement("a");
    a.href = "#" + el.id;
    a.textContent = el.textContent;
    if (cls) a.className = cls;
    if (cls === "top") {
      // The title scrolls to the very top of the page (shows the header too)
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        window.scrollTo({ top: 0 });
        if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
      });
    }
    var li = document.createElement("li");
    li.appendChild(a);
    ul.appendChild(li);
    byId[el.id] = a;
    observed.push(el);
  }

  addItem(titleEl, "top");   // post title is the first item
  Array.prototype.forEach.call(heads, function (h) {
    addItem(h, h.tagName === "H3" ? "sub" : null);
  });
  toc.appendChild(ul);

  // Highlight the section currently in view
  var active = null;
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        if (active) active.classList.remove("active");
        active = byId[e.target.id];
        if (active) active.classList.add("active");
      }
    });
  }, { rootMargin: "0px 0px -75% 0px" });
  observed.forEach(function (el) { obs.observe(el); });
})();
</script>
