  <!-- CSS Styles -->
  <style>
    /* Body Styles */
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 50px;
      overflow: hidden;
      position: relative;
    }

    /* Full-Screen Canvas */
    canvas#backgroundCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Send behind content */
    }

    /* Heading Styles */
    h1 {
      font-family: 'Gloock', serif;
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 30px;
    }

    /* Profile Image Styles */
    .profile-image {
      width: 150px;
      height: 150px;         /* Keep height = width for a perfect circle */
      object-fit: cover;     /* Ensures the image doesn't stretch */
      border-radius: 50%;    /* Circular shape */
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      transition: box-shadow 0.3s ease;
      z-index: 1;
    }
    .profile-image:hover {
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
    }

    /* Links Container */
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Social Media Button Styles */
    .social-button {
      display: flex;
      align-items: center;

      padding: 15px 25px;

      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      font-size: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
    }
    .social-button i {
      margin-right: 10px;
      font-size: 20px;
      transition: transform 0.3s ease;
    }
    .social-button:hover {
      background-color: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.4);
    }
    .social-button:hover i {
      transform: scale(1.2);
    }

    /* Responsive Styles */

</head>
<body>
  <!-- Canvas for Background Animation -->
  <canvas id="backgroundCanvas"></canvas>

  <!-- Profile Image -->
  <img
    src="profile.jpg"
    alt="Profile picture of Eduardo Sanches"
    class="profile-image"
  />
  <!-- Heading -->
  <h1>eduardo sanches</h1>

  <!-- Links Section -->
  <div class="links">
    <a href="https://x.com/_eduardosanches" class="social-button" aria-label="X">
      <i class="fab fa-x-twitter"></i> X
    </a>
    <a href="https://instagram.com/_eduardosanches" class="social-button" aria-label="Instagram">
      <i class="fab fa-instagram"></i> Instagram
    </a>
    <a href="https://www.youtube.com/@eduardo_sanches" class="social-button" aria-label="YouTube">
      <i class="fab fa-youtube"></i> YouTube
    </a>
    <a href="https://substack.com/@eduardosanches" class="social-button" aria-label="Substack">
      <i class="fa-solid fa-notebook"></i> Substack
    </a>
  </div>

  <!-- JavaScript for the New 3D Wavy Checkered Background -->
  <script>
    /** 
     * A new approach: 
     * We'll create a wide 2D grid of points, apply a wave function in the Y dimension,
     * then project them to 2D with perspective. We'll draw only the lines to form
     * a checkered pattern with no fill, in white, and let the mouse influence waves.
     */

    const canvas = document.getElementById("backgroundCanvas");
    const ctx = canvas.getContext("2d");

    let points = [];
    let mouseX = 0;
    let mouseY = 0;

    // Grid & wave configuration
    const squareSize = 50;         // Distance between points in the plane
    const baseAmplitude = 20;      // Base wave amplitude
    const waveLength = 300;        // Distance factor for wave
    const mouseInfluenceRadius = 200; // Mouse ripple radius
    let gridWidth, gridHeight;

    // Perspective / camera config
    let cameraAngle = Math.PI / 4; // 45 deg
    let cameraHeight = 100;
    let perspective = 800;

    // Listen for mouse/touch
    function updateMousePosition(e) {
      if (e.touches && e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      } else {
        mouseX = e.clientX;
        mouseY = e.clientY;
      }
    }
    document.addEventListener("mousemove", updateMousePosition);
    document.addEventListener("touchmove", updateMousePosition, { passive: false });

    // Resize & init
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createGrid();
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Create a large enough grid
    function createGrid() {
      points = [];
      const margin = 20; // Extra squares around the screen
      const baseX = Math.ceil(canvas.width / squareSize);
      const baseY = Math.ceil(canvas.height / squareSize);
      gridWidth = baseX + margin;
      gridHeight = baseY + margin;

      // Generate x, y, z for each point in the plane
      for (let x = 0; x <= gridWidth; x++) {
        points[x] = [];
        for (let y = 0; y <= gridHeight; y++) {
          const xPos = (x - gridWidth / 2) * squareSize;
          const yPos = 0; 
          const zPos = (y - gridHeight / 2) * squareSize;
          points[x][y] = { x: xPos, y: yPos, z: zPos };
        }
      }
    }

    // Perspective projection
    function project3D(x, y, z) {
      const cosA = Math.cos(cameraAngle);
      const sinA = Math.sin(cameraAngle);

      // Rotate around X-axis
      const yRot = y * cosA - z * sinA;
      const zRot = y * sinA + z * cosA;

      const scale = perspective / (perspective + zRot + cameraHeight);
      return {
        x: canvas.width / 2 + x * scale,
        y: canvas.height / 2 + yRot * scale
      };
    }

    // Main animation loop
    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const time = Date.now() * 0.001;

      // Update wave for each point
      for (let x = 0; x <= gridWidth; x++) {
        for (let y = 0; y <= gridHeight; y++) {
          const p = points[x][y];

          // Base wave (distance from center in XZ-plane)
          const distCenter = Math.sqrt(p.x * p.x + p.z * p.z);
          const waveValue = Math.sin(distCenter / waveLength - time) * baseAmplitude;

          // Mouse influence
          const screenPos = project3D(p.x, p.y, p.z);
          const dx = screenPos.x - mouseX;
          const dy = screenPos.y - mouseY;
          const distMouse = Math.sqrt(dx * dx + dy * dy);
          const influence = Math.max(0, mouseInfluenceRadius - distMouse) / mouseInfluenceRadius;
          const mouseWave = waveValue * influence * 2;

          // Final Y 
          p.y = waveValue + mouseWave;
        }
      }

      // Draw checkered lines in white
      ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
      ctx.lineWidth = 1;

      // Draw squares by connecting adjacent points horizontally + vertically
      for (let x = 0; x < gridWidth; x++) {
        for (let y = 0; y < gridHeight; y++) {
          const p1 = points[x][y];
          const p2 = points[x + 1][y];
          const p3 = points[x][y + 1];

          // Project to 2D
          const projP1 = project3D(p1.x, p1.y, p1.z);

          if (p2) {
            const projP2 = project3D(p2.x, p2.y, p2.z);
            ctx.beginPath();
            ctx.moveTo(projP1.x, projP1.y);
            ctx.lineTo(projP2.x, projP2.y);
            ctx.stroke();
          }
          if (p3) {
            const projP3 = project3D(p3.x, p3.y, p3.z);
            ctx.beginPath();
            ctx.moveTo(projP1.x, projP1.y);
            ctx.lineTo(projP3.x, projP3.y);
            ctx.stroke();
          }
        }
      }
    }

    animate();
  </script>
</body>
