  <!-- CSS Styles -->
  <style>
    /* Body Styles */
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 50px;
      overflow: hidden;
      position: relative;
    }

    /* Canvas Styles (Full-Screen) */
    canvas#backgroundCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Send behind content */
    }

    /* Heading Styles */
    h1 {
      font-family: 'Gloock', serif;
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 30px;
    }

    /* Profile Image Styles */
    .profile-image {
      width: 150px;
      height: 150px;       /* Keep height = width for a perfect circle */
      object-fit: cover;   /* Ensures the image doesn't stretch */
      border-radius: 50%;  /* Circular shape */
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      transition: box-shadow 0.3s ease;
      z-index: 1;
    }
    .profile-image:hover {
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);

    /* Links Container */
    .links {
      display: flex;
      flex-wrap: wrap;

    }

    /* Social Media Button Styles */
    .social-button {
      display: flex;

      justify-content: center;
      padding: 15px 25px;
      width: 100%;
      max-width: 250px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      font-size: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .social-button i {
      margin-right: 10px;
      font-size: 20px;
      transition: transform 0.3s ease;
    }
    .social-button:hover {
      background-color: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.4);
    }
    .social-button:hover i {
      transform: scale(1.2);
    }

    /* Responsive Styles */

</head>
<body>
  <!-- Canvas for Background Animation -->
  <canvas id="backgroundCanvas"></canvas>

  <!-- Profile Image -->
  <img
    src="profile.jpg"
    alt="Profile picture of Eduardo Sanches"
    class="profile-image"
  />

  <!-- Heading -->
  <h1>eduardo sanches</h1>

  <!-- Links Section -->
  <div class="links">
    <a href="https://x.com/_eduardosanches" class="social-button" aria-label="X">

    </a>
    <a href="https://instagram.com/_eduardosanches" class="social-button" aria-label="Instagram">

    </a>
    <a href="https://www.youtube.com/@eduardo_sanches" class="social-button" aria-label="YouTube">
      <i class="fab fa-youtube"></i> YouTube
    </a>
    <a href="https://github.com/edusanches" class="social-button" aria-label="GitHub">
      <i class="fab fa-github"></i> GitHub
    </a>
  </div>

  <!-- JavaScript for Background Animation -->
  <script>
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');

    const squareSize = 50; // Size of each square in the grid
    let points = [];

    // Perspective parameters
    const cameraAngle = Math.PI / 4;  // 45 degrees
    const cameraHeight = 200;        // Height above the grid
    const perspective = 800;         // The "distance" factor for perspective

    let mouseX = 0, mouseY = 0;

    // Update mouse position
    function updateMousePosition(e) {
      if (e.touches && e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      } else {
        mouseX = e.clientX;
        mouseY = e.clientY;
      }
    }
    document.addEventListener('mousemove', updateMousePosition);
    document.addEventListener('touchmove', updateMousePosition, { passive: false });

    // Dynamically set canvas size
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initGrid(); // Reinitialize grid to cover the new size
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Create a grid that covers (and slightly exceeds) the entire screen
    function initGrid() {
      points = [];

      // Number of squares needed to cover the screen in each dimension, with some margin
      const squaresX = Math.ceil(canvas.width / squareSize) + 6; 
      const squaresY = Math.ceil(canvas.height / squareSize) + 6;

      // Generate (x, y, z) points in 3D space, centered at screen center
      for (let x = 0; x <= squaresX; x++) {
        points[x] = [];
        for (let y = 0; y <= squaresY; y++) {
          // Shift so the grid is centered
          const xPos = (x - squaresX / 2) * squareSize;
          const yPos = 0;
          const zPos = (y - squaresY / 2) * squareSize;
          points[x][y] = { x: xPos, y: yPos, z: zPos };
        }
      }
    }

    // Project 3D point into 2D screen coordinates
    function project(x, y, z) {
      const cosA = Math.cos(cameraAngle);
      const sinA = Math.sin(cameraAngle);

      // Rotate around X-axis
      const yRot = y * cosA - z * sinA;
      const zRot = y * sinA + z * cosA;

      const scale = perspective / (perspective + zRot + cameraHeight);
      return {
        x: canvas.width / 2 + x * scale,
        y: canvas.height / 2 + yRot * scale
      };
    }

    // Quick bounding-box check to avoid drawing off-screen squares
    function isOffScreen(...corners) {
      const xs = corners.map(p => p.x);
      const ys = corners.map(p => p.y);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);

      // If bounding box is entirely outside the canvas, skip
      if (maxX < 0 || minX > canvas.width || maxY < 0 || minY > canvas.height) {
        return true;
      }
      return false;
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const time = Date.now() * 0.001;
      const amplitude = 20;           // Base height of the wave
      const waveLength = 300;         // Wave length factor
      const influenceRadius = 200;    // Mouse "wave" influence radius

      const gridWidth = points.length;
      const gridHeight = points[0].length;

      // Update each point in the grid
      for (let x = 0; x < gridWidth; x++) {
        for (let y = 0; y < gridHeight; y++) {
          const p = points[x][y];
          const distCenter = Math.sqrt(p.x * p.x + p.z * p.z);

          // Base wave
          const defaultWave = Math.sin(distCenter / waveLength - time) * amplitude;

          // Mouse wave influence
          const projP = project(p.x, p.y, p.z);
          const dx = projP.x - mouseX;
          const dy = projP.y - mouseY;
          const distMouse = Math.sqrt(dx * dx + dy * dy);
          const influence = Math.max(0, influenceRadius - distMouse) / influenceRadius;
          const mouseWave = Math.sin(distCenter / waveLength - time) * amplitude * influence * 2;

          // Combine wave effects
          p.y = defaultWave + mouseWave;
        }
      }

      // Draw squares by connecting adjacent points
      for (let x = 0; x < gridWidth - 1; x++) {
        for (let y = 0; y < gridHeight - 1; y++) {
          const p1 = points[x][y];
          const p2 = points[x + 1][y];
          const p3 = points[x + 1][y + 1];
          const p4 = points[x][y + 1];

          // Project 3D -> 2D
          const projP1 = project(p1.x, p1.y, p1.z);
          const projP2 = project(p2.x, p2.y, p2.z);
          const projP3 = project(p3.x, p3.y, p3.z);
          const projP4 = project(p4.x, p4.y, p4.z);

          // Skip drawing if offscreen
          if (isOffScreen(projP1, projP2, projP3, projP4)) continue;

          // Draw the quadrilateral
          ctx.beginPath();
          ctx.moveTo(projP1.x, projP1.y);
          ctx.lineTo(projP2.x, projP2.y);
          ctx.lineTo(projP3.x, projP3.y);
          ctx.lineTo(projP4.x, projP4.y);
          ctx.closePath();

          // Light stroke
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    animate();
  </script>
</body>
