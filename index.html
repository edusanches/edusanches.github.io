<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>eduardo sanches</title>
  <meta name="description" content="A collection of important links for Eduardo Sanches." />
  <meta name="keywords" content="Eduardo Sanches, Links, Blog, X, Instagram, YouTube" />

  <!-- Favicon -->
  <link rel="icon" href="favicon.png" type="image/png" />

  <meta name="theme-color" content="#0a0a0b" />
  <meta name="color-scheme" content="dark" />

  <!-- Google Fonts: Sora (display) · Inter (body) · IBM Plex Mono (utility) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink:   #0a0a0b;
      --paper: #f5f6f7;
      --grey:  #9a9a9f;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--paper);
      text-align: center;
      background: radial-gradient(125% 95% at 50% -10%, #18181a 0%, var(--ink) 56%, #050506 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
      overscroll-behavior: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 20px;
    }

    canvas#mesh {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      display: block;
      touch-action: none;
    }

    /* Soft vignette to settle the mesh behind the content (flat, no glow) */
    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(70% 56% at 50% 46%, transparent 46%, rgba(5, 5, 6, 0.55) 100%);
    }

    /* ===== Content: no card, flat elements floating over the mesh ===== */
    .stage {
      position: relative;
      z-index: 1;
      width: min(460px, 92vw);
    }
    /* Soft dark halo behind the photo / name / tagline to mute the grid there */
    .stage::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 50%;
      top: -16px;
      width: 100%;
      height: 330px;
      transform: translateX(-50%);
      background: radial-gradient(50% 50% at 50% 50%, rgba(8, 8, 9, 0.92) 0%, rgba(8, 8, 9, 0.55) 42%, rgba(8, 8, 9, 0) 72%);
      filter: blur(4px);
      pointer-events: none;
    }

    .avatar {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 22px;
      cursor: pointer;
    }
    /* Soft halo behind the photo instead of a hard outline */
    .avatar::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      z-index: -1;
      background: radial-gradient(closest-side, rgba(245, 246, 247, 0.16), transparent 78%);
      pointer-events: none;
    }
    .profile-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease;
    }
    .avatar:hover .profile-image {
      transform: scale(1.04);
      filter: saturate(1.06) brightness(1.05);
    }

    h1 {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: clamp(30px, 7.5vw, 40px);
      line-height: 1.05;
      letter-spacing: -0.022em;
      color: var(--paper);
      margin: 0 0 10px;
      text-shadow: 0 1px 30px rgba(0, 0, 0, 0.9), 0 1px 3px rgba(0, 0, 0, 0.7);
    }

    .tagline {
      font-size: 13.5px;
      color: #b0b0b6;
      margin: 0 0 34px;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(0, 0, 0, 0.85);
    }
    .tagline b { color: var(--paper); font-weight: 600; }

    /* Flat buttons — no glass, no blur, no shadow, no depth */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
      margin: 0 auto;
    }

    .social-button {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      padding: 14px 18px;
      border-radius: 14px;
      text-align: center;
      text-decoration: none;
      color: var(--paper);
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 15px;
      background: rgba(245, 246, 247, 0.10);
      border: 1px solid rgba(245, 246, 247, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      -webkit-tap-highlight-color: transparent;
      transition: color 0.35s ease, border-color 0.35s ease;
    }
    /* White fill that wipes in from the left on hover; text turns dark */
    .social-button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--paper);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .social-button:hover,
    .social-button:focus-visible,
    .social-button.is-active {
      color: #0a0a0b;
      border-color: var(--paper);
    }
    .social-button:hover::before,
    .social-button:focus-visible::before,
    .social-button.is-active::before {
      transform: scaleX(1);
    }
    .social-button:focus-visible {
      outline: 2px solid rgba(245, 246, 247, 0.8);
      outline-offset: 3px;
    }

    @media (max-width: 380px) {
      .avatar { width: 104px; height: 104px; }
      .social-button { font-size: 14px; padding: 13px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .social-button, .social-button::before, .profile-image { transition: none; }
      .avatar:hover .profile-image { transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="mesh" aria-hidden="true"></canvas>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="stage">
    <span class="avatar">
      <img src="profile.jpg" alt="Profile picture of Eduardo Sanches" class="profile-image" width="120" height="120" decoding="async" />
    </span>

    <h1>eduardo sanches</h1>
    <p class="tagline">creative dev &middot; <b>building things for the web</b></p>

    <nav class="links" aria-label="Social links">
      <a class="social-button" href="https://x.com/_eduardosanches" target="_blank" rel="noopener noreferrer">X</a>
      <a class="social-button" href="https://instagram.com/_eduardosanches" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="social-button" href="https://www.youtube.com/@eduardo_sanches" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a class="social-button" href="/blog/">Blog</a>
    </nav>
  </main>

  <script>
  (function () {
    "use strict";

    var canvas = document.getElementById("mesh");
    var ctx = canvas.getContext("2d", { alpha: true });
    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var avatarEl = document.querySelector(".avatar");
    // Projection origin — anchored to the centre of the photo, not the viewport
    var originX = 0, originY = 0;

    // ---- Flat line colour (monochrome white, no gradient / no glow) ----
    var LINE = [240, 242, 247];

    // ---- Adaptive tunables ----
    var DPR = 1;
    var isMobile = window.innerWidth < 720;
    var spacing = isMobile ? 70 : 64;     // larger spacing -> fewer nodes (perf)

    // Perspective / camera (direct descendant of the original grid)
    var cameraAngle = Math.PI / 3.2;
    var cameraHeight = 120;
    var perspective = 1500;
    var cosA = Math.cos(cameraAngle);
    var sinA = Math.sin(cameraAngle);

    // Wave config — multi-octave undulation
    var waveLength = 320;
    var baseAmp = isMobile ? 16 : 22;
    var mouseRadius = 230;
    var maxDepth = 1150;

    var W = 0, H = 0, cols = 0, rows = 0, points = [];

    // Smoothed mouse for fluid warp
    var mouseX = -9999, mouseY = -9999;
    var targetMX = -9999, targetMY = -9999;

    var buttons = document.querySelectorAll(".social-button");
    var touchTime = -1e9;
    function onMouseMove(e) {
      // Ignore synthetic mouse events fired right after a touch (mobile ghost events)
      if (Date.now() - touchTime < 700) return;
      targetMX = e.clientX;
      targetMY = e.clientY;
    }
    function onTouch(e) {
      touchTime = Date.now();
      var t = e.touches && e.touches[0];
      if (!t) return;
      targetMX = t.clientX;
      targetMY = t.clientY;
      mouseX = t.clientX;   // snap on touch — no easing lag, follows the finger
      mouseY = t.clientY;
      // Touch equivalent of :hover — fill the button under the finger
      var el = document.elementFromPoint(t.clientX, t.clientY);
      var btn = el && el.closest ? el.closest(".social-button") : null;
      for (var b = 0; b < buttons.length; b++) {
        buttons[b].classList.toggle("is-active", buttons[b] === btn);
      }
    }
    window.addEventListener("mousemove", onMouseMove, { passive: true });
    window.addEventListener("touchstart", onTouch, { passive: true });
    window.addEventListener("touchmove", onTouch, { passive: true });
    window.addEventListener("mouseleave", function () { targetMX = -9999; targetMY = -9999; });
    // On touch release, forget the last position immediately (no lingering warp)
    function clearTouch() {
      touchTime = Date.now();
      targetMX = -9999; targetMY = -9999; mouseX = -9999; mouseY = -9999;
      for (var b = 0; b < buttons.length; b++) buttons[b].classList.remove("is-active");
    }
    window.addEventListener("touchend", clearTouch, { passive: true });
    window.addEventListener("touchcancel", clearTouch, { passive: true });

    // Anchor the grid origin to the photo centre (fallback: viewport centre)
    function updateOrigin() {
      if (avatarEl) {
        var r = avatarEl.getBoundingClientRect();
        if (r.width) {
          originX = r.left + r.width / 2;
          originY = r.top + r.height / 2;
          return;
        }
      }
      originX = W / 2;
      originY = H / 2;
    }

    function resize() {
      DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      isMobile = window.innerWidth < 720;
      spacing = isMobile ? 70 : 64;
      baseAmp = isMobile ? 16 : 22;
      cameraAngle = isMobile ? Math.PI / 4 : Math.PI / 3.2;  // smaller angle = more inclined on mobile
      cosA = Math.cos(cameraAngle);
      sinA = Math.sin(cameraAngle);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      updateOrigin();
      buildGrid();
      if (reduceMotion) renderStatic();
    }

    function buildGrid() {
      var margin = 14;
      cols = Math.ceil(W / spacing) + margin;
      rows = Math.ceil(H / spacing) + margin + 8;   // extra rows for depth
      points = [];
      for (var i = 0; i <= cols; i++) {
        points[i] = [];
        for (var j = 0; j <= rows; j++) {
          points[i][j] = {
            x: (i - cols / 2) * spacing,
            z: (j - rows / 2) * spacing,
            y: 0, sx: 0, sy: 0, scale: 1, depth: 0, lift: 0
          };
        }
      }
    }

    // Perspective projection: scale = perspective / (perspective + depth)
    function project(p) {
      var yRot = p.y * cosA - p.z * sinA;
      var zRot = p.y * sinA + p.z * cosA;
      var scale = perspective / (perspective + zRot + cameraHeight);
      p.sx = originX + p.x * scale;
      p.sy = originY + yRot * scale;
      p.scale = scale;
      p.depth = zRot;
    }

    // Multi-octave (layered sine) height field — organic motion
    function heightAt(dist, x, z, t) {
      var h = Math.sin(dist / waveLength - t) * baseAmp;          // original wave
      h += Math.sin(x * 0.012 + t * 1.3) * baseAmp * 0.45;
      h += Math.cos(z * 0.010 - t * 0.9) * baseAmp * 0.35;
      h += Math.sin((x + z) * 0.006 + t * 0.6) * baseAmp * 0.25;
      return h;
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function fog(depth) { return Math.max(0, 1 - Math.abs(depth) / maxDepth); }

    // Flat wireframe edge — one tone, fog-faded, no additive glow
    function drawEdge(a, b) {
      var depth = (a.depth + b.depth) * 0.5;
      if (depth > maxDepth) return;
      var f = fog(depth);
      if (f <= 0.01) return;
      var lift = a.lift > b.lift ? a.lift : b.lift;
      var alpha = f * (0.08 + lift * 0.5);
      ctx.strokeStyle = "rgba(" + LINE[0] + "," + LINE[1] + "," + LINE[2] + "," + alpha + ")";
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.lineTo(b.sx, b.sy);
      ctx.stroke();
    }

    // Flat node — a small solid dot, no glowing core
    function drawNode(p) {
      if (p.depth > maxDepth) return;
      var f = fog(p.depth);
      if (f <= 0.02) return;
      var r = 0.8 + p.scale * 1.1 + p.lift * 1.4;
      var a = f * (0.14 + p.lift * 0.5);
      ctx.fillStyle = "rgba(" + LINE[0] + "," + LINE[1] + "," + LINE[2] + "," + a + ")";
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- Explosion shockwave (triggered by hovering the photo) ----
    var EXP_DUR = 1.8;       // seconds the wave lives
    var EXP_SPEED = 950;     // world units/sec the wavefront travels outward
    var EXP_SIGMA = 190;     // ring thickness
    var EXP_TWOSIG = 2 * EXP_SIGMA * EXP_SIGMA;
    var EXP_AMP = 150;       // peak lift toward viewer at the wavefront
    var explosions = [];
    var lastT = 0;

    var start = 0;

    function renderScene(t) {
      mouseX = lerp(mouseX, targetMX, 0.12);
      mouseY = lerp(mouseY, targetMY, 0.12);
      var mouseActive = targetMX > -9000;

      lastT = t;
      if (explosions.length) {
        var alive = [];
        for (var ei = 0; ei < explosions.length; ei++) {
          if (t - explosions[ei].t0 <= EXP_DUR) alive.push(explosions[ei]);
        }
        explosions = alive;
      }

      ctx.clearRect(0, 0, W, H);
      ctx.lineWidth = 1;
      // flat rendering: default source-over compositing (no additive "lighter")

      var i, j, p;

      // Heights
      for (i = 0; i <= cols; i++) {
        for (j = 0; j <= rows; j++) {
          p = points[i][j];
          var dist = Math.sqrt(p.x * p.x + p.z * p.z);
          p.y = heightAt(dist, p.x, p.z, t);
          p.lift = 0;
          for (var ex = 0; ex < explosions.length; ex++) {
            var age = t - explosions[ex].t0;
            if (age < 0 || age > EXP_DUR) continue;
            var dd = dist - age * EXP_SPEED;
            var ring = Math.exp(-(dd * dd) / EXP_TWOSIG);
            var env = 1 - age / EXP_DUR;
            p.y -= ring * EXP_AMP * env;
            if (ring * env > p.lift) p.lift = ring * env;
          }
        }
      }
      // Project (need screen pos to measure mouse distance)
      for (i = 0; i <= cols; i++) {
        for (j = 0; j <= rows; j++) project(points[i][j]);
      }
      // Mouse warp: lift surface toward viewer near the cursor
      if (mouseActive) {
        for (i = 0; i <= cols; i++) {
          for (j = 0; j <= rows; j++) {
            p = points[i][j];
            var dx = p.sx - mouseX, dy = p.sy - mouseY;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d < mouseRadius) {
              var inf = 1 - d / mouseRadius;
              var e = inf * inf;
              if (e > p.lift) p.lift = e;
              p.y -= e * baseAmp * 2.4;
            }
          }
        }
        for (i = 0; i <= cols; i++) {
          for (j = 0; j <= rows; j++) {
            if (points[i][j].lift > 0) project(points[i][j]);
          }
        }
      }

      // Wireframe edges (depth fog)
      for (i = 0; i <= cols; i++) {
        for (j = 0; j <= rows; j++) {
          p = points[i][j];
          if (i < cols) drawEdge(p, points[i + 1][j]);
          if (j < rows) drawEdge(p, points[i][j + 1]);
        }
      }

      // Flat nodes — a dot on every grid corner
      var step = 1;
      for (i = 0; i <= cols; i += step) {
        for (j = 0; j <= rows; j += step) {
          drawNode(points[i][j]);
        }
      }
    }

    var raf = null;
    function frame(now) {
      if (!start) start = now;
      var t = (now - start) * 0.001;
      renderScene(t);
      raf = requestAnimationFrame(frame);
    }

    function renderStatic() {
      // calm single frame, fixed phase, no mouse warp
      start = 0;
      renderScene(1.2);
    }

    window.addEventListener("resize", resize, { passive: true });

    // Recompute the photo-anchored origin once fonts/layout settle
    window.addEventListener("load", function () {
      updateOrigin();
      if (reduceMotion) renderStatic();
    });

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      } else if (!reduceMotion && !raf) {
        start = 0;
        raf = requestAnimationFrame(frame);
      }
    });

    // React to motion-preference changes live
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
      var onMq = function () {
        reduceMotion = mq.matches;
        if (reduceMotion) {
          if (raf) { cancelAnimationFrame(raf); raf = null; }
          renderStatic();
        } else if (!raf) {
          start = 0;
          raf = requestAnimationFrame(frame);
        }
      };
      if (mq.addEventListener) mq.addEventListener("change", onMq);
      else if (mq.addListener) mq.addListener(onMq);
    }

    // Trigger a shockwave when the photo is hovered (or tapped on touch)
    if (avatarEl) {
      var burst = function () {
        if (reduceMotion) return;
        if (explosions.length < 5) explosions.push({ t0: lastT });
      };
      avatarEl.addEventListener("mouseenter", burst);
      avatarEl.addEventListener("touchstart", burst, { passive: true });
    }

    // Boot
    resize();
    if (reduceMotion) {
      renderStatic();
    } else {
      raf = requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
</html>
