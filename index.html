<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>eduardo sanches</title>
  <!-- Other meta, fonts, etc. ... -->

  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 50px;
      margin: 0;
      overflow: hidden;
      position: relative;
    }
    canvas#backgroundCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    /* etc... (Your existing styles) */
  </style>
</head>
<body>
  <canvas id="backgroundCanvas"></canvas>
  <img src="profile.jpg" alt="Profile" class="profile-image" />
  <h1>eduardo sanches</h1>
  <div class="links">
    <!-- Social links here -->
  </div>
  
  <script>
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');
    
    let gridSizeX = 50; 
    let gridSizeY = 50; 
    const squareSize = 50;
    let points = [];

    // Perspective parameters
    const cameraAngle = Math.PI / 4; // 45 degrees
    const cameraHeight = 200;
    const perspective = 800;

    let mouseX = 0;
    let mouseY = 0;

    document.addEventListener('mousemove', updateMousePosition);
    document.addEventListener('touchmove', updateMousePosition, {passive: false});

    function updateMousePosition(e) {
      if (e.touches && e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      } else {
        mouseX = e.clientX;
        mouseY = e.clientY;
      }
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initGrid();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initGrid() {
      points = [];
      for (let x = 0; x <= gridSizeX; x++) {
        points[x] = [];
        for (let y = 0; y <= gridSizeY; y++) {
          const xPos = (x - gridSizeX / 2) * squareSize;
          const yPos = 0; 
          const zPos = (y - gridSizeY / 2) * squareSize;
          points[x][y] = {x: xPos, y: yPos, z: zPos};
        }
      }
    }

    function project(x, y, z) {
      const cosA = Math.cos(cameraAngle);
      const sinA = Math.sin(cameraAngle);
      const yRot = y * cosA - z * sinA;
      const zRot = y * sinA + z * cosA;

      const scale = perspective / (perspective + zRot + cameraHeight);
      return {
        x: canvas.width / 2 + x * scale,
        y: canvas.height / 2 + yRot * scale
      };
    }

    function isOffScreen(...corners) {
      const xs = corners.map(p => p.x);
      const ys = corners.map(p => p.y);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      if (maxX < 0 || minX > canvas.width || maxY < 0 || minY > canvas.height) {
        return true;
      }
      return false;
    }

    let frameCount = 0;
    function animate() {
      requestAnimationFrame(animate);

      // Throttle the frame rate if needed (e.g., run at ~30 FPS)
      frameCount++;
      // if (frameCount % 2 !== 0) return; // Uncomment to skip every other frame

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const time = Date.now() * 0.001;
      const amplitude = 20;
      const waveLength = 300;
      const influenceRadius = 200;

      const gridWidth = points.length;
      const gridHeight = points[0].length;

      for (let x = 0; x < gridWidth; x++) {
        for (let y = 0; y < gridHeight; y++) {
          const p = points[x][y];
          const distanceFromCenter = Math.sqrt(p.x * p.x + p.z * p.z);

          // Base wave
          const defaultWave = Math.sin(distanceFromCenter / waveLength - time) * amplitude;
          const projP = project(p.x, p.y, p.z);

          // Mouse wave influence
          const dxMouse = projP.x - mouseX;
          const dyMouse = projP.y - mouseY;
          const distanceToMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
          const influence = Math.max(0, influenceRadius - distanceToMouse) / influenceRadius;
          const mouseWave = Math.sin(distanceFromCenter / waveLength - time) * amplitude * influence * 2;

          p.y = defaultWave + mouseWave;
        }
      }

      // Draw squares
      for (let x = 0; x < gridWidth - 1; x++) {
        for (let y = 0; y < gridHeight - 1; y++) {
          const p1 = points[x][y];
          const p2 = points[x + 1][y];
          const p3 = points[x + 1][y + 1];
          const p4 = points[x][y + 1];

          const projP1 = project(p1.x, p1.y, p1.z);
          const projP2 = project(p2.x, p2.y, p2.z);
          const projP3 = project(p3.x, p3.y, p3.z);
          const projP4 = project(p4.x, p4.y, p4.z);

          // Skip drawing if it's entirely offscreen
          if (isOffScreen(projP1, projP2, projP3, projP4)) continue;

          ctx.beginPath();
          ctx.moveTo(projP1.x, projP1.y);
          ctx.lineTo(projP2.x, projP2.y);
          ctx.lineTo(projP3.x, projP3.y);
          ctx.lineTo(projP4.x, projP4.y);
          ctx.closePath();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    animate();
  </script>
</body>
</html>
