<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>eduardo sanches</title>
  <meta name="description" content="A collection of important links for Eduardo Sanches." />
  <meta name="keywords" content="Eduardo Sanches, Links, Blog, X, Instagram, YouTube" />

  <!-- Favicon -->
  <link rel="icon" href="favicon.png" type="image/png" />

  <meta name="theme-color" content="#cf6a2b" />
  <meta name="color-scheme" content="dark" />

  <!-- Google Fonts: Sora (display) · Inter (body) · IBM Plex Mono (utility) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Type */
      --font-display: 'Sora', sans-serif;
      --font-body:    'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, monospace;
      /* Colour */
      --ink:       #0a0a0b;        /* page background       */
      --panel:     #121214;        /* raised surface        */
      --paper:     #f5f6f7;        /* primary text          */
      --soft:      #c7c7cc;        /* secondary text        */
      --grey:      #9a9a9f;        /* tertiary / meta text  */
      --paper-rgb: 245, 246, 247;  /* for translucent fills */
      --line:      rgba(var(--paper-rgb), 0.12);  /* hairlines */
      /* Shape & layout */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --reading:   680px;
      /* Spacing (4-based scale) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
    }

    /* Custom cursor: modern black rounded arrow (native SVG cursor — zero lag).
       Same block on home, blog layout and editor; keep them in sync. */
    html, body,
    a, button, [role="button"], label, summary {
      cursor: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='26'%20height='26'%20viewBox='0%200%2024%2024'%3E%3Cpath%20d='M4.037%204.688a.495.495%200%200%201%20.651-.651l16%206.5a.5.5%200%200%201-.063.947l-6.124%201.58a2%202%200%200%200-1.438%201.435l-1.579%206.126a.5.5%200%200%201-.947.063z'%20fill='%23000000'%20stroke='%23000000'%20stroke-width='1.5'%20stroke-linejoin='round'%20transform='rotate(15%2012%2012)'/%3E%3C/svg%3E") 7 3, auto;
    }
    input, textarea, select, [contenteditable] { cursor: text; }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      font-family: var(--font-body);
      color: var(--paper);
      text-align: center;
      /* Warm/teal tonal field: eclipse blobs with hot rims over a teal
         channel, oranges in the corners — the mesh draws on top of this */
      background-color: #d94e1c;
      background:
        radial-gradient(52% 55% at 78% 6%, #140a0f 0%, #140a0f 26%, #4a1013 38%, #d13b16 47%, #ff8c30 53%, rgba(255, 140, 48, 0) 60%),
        radial-gradient(55% 60% at 18% 102%, #150a0e 0%, #150a0e 24%, #4d1013 37%, #d43d15 46%, #ff9134 52%, rgba(255, 145, 52, 0) 59%),
        radial-gradient(58% 42% at 2% 2%, #ecad5f 0%, rgba(236, 173, 95, 0) 50%),
        radial-gradient(52% 42% at 100% 100%, #f0a04e 0%, rgba(240, 160, 78, 0) 48%),
        radial-gradient(75% 44% at 30% 40%, #1e5058 0%, #1e5058 38%, rgba(30, 80, 88, 0) 58%),
        radial-gradient(80% 46% at 74% 70%, #1b4b53 0%, #1b4b53 40%, rgba(27, 75, 83, 0) 60%),
        linear-gradient(160deg, #dd8a38 0%, #d94e1c 45%, #e0812f 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
      overscroll-behavior: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 20px;
    }
    /* Portrait: re-aim the field so the teal reads as a diagonal channel
       between the two eclipse blobs (same palette, different geometry) */
    @media (orientation: portrait) {
      body {
        background:
          radial-gradient(80% 38% at 82% 10%, #140a0f 0%, #140a0f 22%, #4a1013 36%, #d13b16 46%, #ff8c30 52%, rgba(255, 140, 48, 0) 60%),
          radial-gradient(85% 40% at 30% 98%, #150a0e 0%, #150a0e 20%, #4d1013 34%, #d43d15 44%, #ff9134 51%, rgba(255, 145, 52, 0) 59%),
          radial-gradient(70% 30% at 0% 0%, #ecad5f 0%, rgba(236, 173, 95, 0) 55%),
          radial-gradient(65% 28% at 100% 100%, #f0a04e 0%, rgba(240, 160, 78, 0) 52%),
          radial-gradient(75% 26% at 16% 42%, #1e5058 0%, #1e5058 36%, rgba(30, 80, 88, 0) 58%),
          radial-gradient(80% 28% at 84% 62%, #1b4b53 0%, #1b4b53 38%, rgba(27, 75, 83, 0) 60%),
          radial-gradient(60% 22% at 50% 52%, #1d4f57 0%, #1d4f57 34%, rgba(29, 79, 87, 0) 60%),
          linear-gradient(170deg, #dd8a38 0%, #d94e1c 45%, #e0812f 100%);
      }
    }

    /* Liquid tonal field: WebGL when available (animated, mouse-reactive),
       otherwise a single static 2D render. The CSS gradients on body are
       the no-JS fallback. */
    canvas#field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      display: block;
      pointer-events: none;
    }

    /* ===== Content: no card, flat elements floating over the mesh ===== */
    .stage {
      position: relative;
      z-index: 1;
      width: min(460px, 92vw);
    }

    .avatar {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 22px;
      cursor: inherit;                    /* keep the custom arrow */
      perspective: 600px;                 /* real depth for the push-in */
    }
    /* Sonar rings — 1px hairlines that ripple outward, synced with the
       mesh shockwave fired on hover/tap (see burst() below) */
    .avatar .pulse {
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      z-index: -1;
      border: 1px solid rgba(var(--paper-rgb), 0.55);
      opacity: 0;
      pointer-events: none;
    }
    .avatar .pulse + .pulse {
      border-color: rgba(var(--paper-rgb), 0.32);
    }
    .avatar.is-pulsing .pulse {
      animation: avatar-ring 1.15s cubic-bezier(0.2, 0.55, 0.3, 1) both;
    }
    .avatar.is-pulsing .pulse + .pulse {
      animation-delay: 0.18s;
    }
    @keyframes avatar-ring {
      0%   { transform: scale(1); opacity: 0; }
      12%  { opacity: 1; }
      100% { transform: scale(2.3); opacity: 0; }
    }
    /* Rim shadow that recedes with the photo — sets it into a recess */
    .avatar::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(closest-side, transparent 50%, rgba(0, 0, 0, 0.5) 100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease;
    }
    .profile-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      box-shadow: 0 0 0 1px var(--line);  /* resting hairline rim, echoes the grid */
      transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.5s ease;
    }
    @media (hover: hover) {
      .avatar:hover .profile-image {
        transform: translateZ(-65px);     /* sinks into the scene */
        filter: brightness(0.84) saturate(0.95);
      }
      .avatar:hover::after {
        transform: translateZ(-65px);     /* travels with the photo, framing it */
        opacity: 1;
      }
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(30px, 7.5vw, 40px);
      line-height: 1.05;
      letter-spacing: -0.022em;
      color: var(--paper);
      margin: 0 0 10px;
      text-shadow: 0 1px 30px rgba(0, 0, 0, 0.9), 0 1px 3px rgba(0, 0, 0, 0.7);
    }

    .tagline {
      font-size: 14px;
      color: var(--soft);
      margin: 0 0 34px;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(0, 0, 0, 0.85);
    }
    .tagline b { color: var(--paper); font-weight: 600; }

    /* Flat buttons — no glass, no blur, no shadow, no depth */
    .links {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      max-width: 320px;
      margin: 0 auto;
    }

    .social-button {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      text-align: center;
      text-decoration: none;
      color: var(--paper);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 15px;
      background: rgba(var(--paper-rgb), 0.10);
      border: 1px solid rgba(var(--paper-rgb), 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      -webkit-tap-highlight-color: transparent;
      transition: color 0.35s ease, border-color 0.35s ease;
    }
    /* White fill that wipes in from the left on hover; text turns dark */
    .social-button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--paper);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .social-button:focus-visible,
    .social-button.is-active {
      color: var(--ink);
      border-color: var(--paper);
    }
    .social-button:focus-visible::before,
    .social-button.is-active::before {
      transform: scaleX(1);
    }
    /* Real hover only on pointer devices — avoids sticky hover on touch */
    @media (hover: hover) {
      .social-button:hover {
        color: var(--ink);
        border-color: var(--paper);
      }
      .social-button:hover::before {
        transform: scaleX(1);
      }
    }
    .social-button:focus-visible {
      outline: 2px solid rgba(var(--paper-rgb), 0.8);
      outline-offset: 3px;
    }

    @media (max-width: 380px) {
      .avatar { width: 104px; height: 104px; }
      .social-button { font-size: 14px; padding: 13px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .social-button, .social-button::before, .profile-image, .avatar::after { transition: none; }
      .avatar:hover .profile-image, .avatar:hover::after { transform: none; }
      .avatar.is-pulsing .pulse { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <main class="stage">
    <span class="avatar">
      <span class="pulse" aria-hidden="true"></span>
      <span class="pulse" aria-hidden="true"></span>
      <img src="profile.jpg" alt="Profile picture of Eduardo Sanches" class="profile-image" width="120" height="120" decoding="async" />
    </span>

    <h1>eduardo sanches</h1>
    <p class="tagline">creative dev &middot; <b>building things for the web</b></p>

    <nav class="links" aria-label="Social links">
      <a class="social-button" href="https://x.com/oeduardosanches" target="_blank" rel="noopener noreferrer">X</a>
      <a class="social-button" href="https://instagram.com/_eduardosanches" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="social-button" href="https://www.youtube.com/@eduardo_sanches" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a class="social-button" href="/blog/">Blog</a>
    </nav>
  </main>

  <script>
  // Liquid tonal field.
  // Display: one scalar field (gaussian blobs/wells + domain warp + colour
  // ramp + grain) rendered by a fragment shader. The photo press/ripple and
  // the slow autonomous drift live here.
  // Fluid: when WebGL2 + float buffers are available, a real Navier-Stokes
  // simulation (velocity advection + pressure projection on a small grid)
  // warps the field's sampling coordinates — the mouse genuinely stirs the
  // liquid and it swirls, spreads and settles back on its own.
  // Fallbacks: WebGL1 -> same display, ripple-trail instead of fluid;
  // no WebGL -> one static 2D render; no JS -> the CSS gradients on body.
  (function () {
    "use strict";

    var cv = document.getElementById("field");
    if (!cv) return;

    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var avatarEl = document.querySelector(".avatar");
    var buttons = document.querySelectorAll(".social-button");

    var DPR = 1, W = 0, H = 0;

    function sizeCanvas() {
      DPR = Math.max(1, Math.min(1.5, window.devicePixelRatio || 1));
      W = Math.max(1, Math.round(window.innerWidth * DPR));
      H = Math.max(1, Math.round(window.innerHeight * DPR));
      var CAP = 4200000;
      if (W * H > CAP) {
        var s = Math.sqrt(CAP / (W * H));
        W = Math.round(W * s);
        H = Math.round(H * s);
      }
      cv.width = W;
      cv.height = H;
      cv.style.width = window.innerWidth + "px";
      cv.style.height = window.innerHeight + "px";
    }

    // window px -> device px (canvas coords, y up like gl_FragCoord)
    function toDev(cx, cy) {
      return [cx * (W / window.innerWidth), H - cy * (H / window.innerHeight)];
    }

    /* ================= static 2D fallback ================= */

    var STOPS = [
      [0.00, 18, 63, 73], [0.30, 29, 81, 90], [0.52, 230, 167, 92],
      [0.62, 234, 127, 46], [0.70, 255, 150, 52], [0.78, 212, 59, 22],
      [0.88, 74, 16, 19], [1.00, 18, 10, 14]
    ];

    function blobsFor(portrait) {
      return portrait ? [
        { x: 0.82, y: 0.08, sx: 0.42, sy: 0.24, a: 0.62 },
        { x: 0.22, y: 0.98, sx: 0.45, sy: 0.26, a: 0.62 },
        { x: 0.12, y: 0.40, sx: 0.34, sy: 0.16, a: -0.60 },
        { x: 0.55, y: 0.52, sx: 0.30, sy: 0.15, a: -0.55 },
        { x: 0.92, y: 0.62, sx: 0.34, sy: 0.16, a: -0.60 },
        { x: 0.02, y: 0.02, sx: 0.30, sy: 0.18, a: 0.10 },
        { x: 0.98, y: 0.98, sx: 0.30, sy: 0.18, a: 0.10 }
      ] : [
        { x: 0.78, y: 0.04, sx: 0.26, sy: 0.34, a: 0.62 },
        { x: 0.16, y: 1.00, sx: 0.28, sy: 0.38, a: 0.62 },
        { x: 0.24, y: 0.42, sx: 0.26, sy: 0.22, a: -0.60 },
        { x: 0.58, y: 0.56, sx: 0.24, sy: 0.20, a: -0.52 },
        { x: 0.90, y: 0.66, sx: 0.28, sy: 0.22, a: -0.60 },
        { x: 0.02, y: 0.02, sx: 0.24, sy: 0.26, a: 0.10 },
        { x: 0.99, y: 0.98, sx: 0.24, sy: 0.26, a: 0.10 }
      ];
    }

    function render2d() {
      var ctx2 = cv.getContext("2d", { alpha: false });
      if (!ctx2) return;
      var LUT = new Uint8Array(1024 * 3);
      for (var i = 0; i < 1024; i++) {
        var t = i / 1023, s = 0;
        while (s < STOPS.length - 2 && t > STOPS[s + 1][0]) s++;
        var a = STOPS[s], b = STOPS[s + 1];
        var k = (t - a[0]) / (b[0] - a[0]);
        k = k < 0 ? 0 : k > 1 ? 1 : k;
        LUT[i * 3] = a[1] + (b[1] - a[1]) * k;
        LUT[i * 3 + 1] = a[2] + (b[2] - a[2]) * k;
        LUT[i * 3 + 2] = a[3] + (b[3] - a[3]) * k;
      }
      var STEP = 4;
      var G = blobsFor(H > W);
      var gw = Math.ceil(W / STEP) + 2, gh = Math.ceil(H / STEP) + 2;
      var field = new Float32Array(gw * gh);
      for (var gy = 0; gy < gh; gy++) {
        var v = (gy * STEP) / H;
        for (var gx = 0; gx < gw; gx++) {
          var u = (gx * STEP) / W;
          var wu = u + 0.045 * Math.sin(v * 4.6 + 1.2) + 0.02 * Math.sin(v * 10.3 + 3.1);
          var wv = v + 0.055 * Math.sin(u * 3.9 + 0.6) + 0.02 * Math.sin(u * 8.3 + 5.0);
          var f = 0.60;
          for (var bi = 0; bi < G.length; bi++) {
            var g = G[bi];
            var dx = (wu - g.x) / g.sx, dy = (wv - g.y) / g.sy;
            var q = dx * dx + dy * dy;
            if (q < 9) f += g.a * Math.exp(-q);
          }
          field[gy * gw + gx] = f;
        }
      }
      var img = ctx2.createImageData(W, H);
      var d = img.data;
      var seed = 0x9e3779b9 | 0;
      var p = 0;
      for (var y = 0; y < H; y++) {
        var fy = y / STEP, y0 = fy | 0, ty = fy - y0;
        var r0 = y0 * gw, r1 = r0 + gw;
        for (var x = 0; x < W; x++) {
          var fx = x / STEP, x0 = fx | 0, tx = fx - x0;
          var f00 = field[r0 + x0], f10 = field[r0 + x0 + 1];
          var f01 = field[r1 + x0], f11 = field[r1 + x0 + 1];
          var top = f00 + (f10 - f00) * tx;
          var bot = f01 + (f11 - f01) * tx;
          var f = top + (bot - top) * ty;
          var tt = f < 0 ? 0 : f > 1 ? 1 : f;
          var idx = ((tt * 1023) | 0) * 3;
          seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
          var n = ((seed & 255) / 255 - 0.5) * 26;
          var rr = LUT[idx] + n, gg = LUT[idx + 1] + n, bb = LUT[idx + 2] + n;
          d[p] = rr < 0 ? 0 : rr > 255 ? 255 : rr;
          d[p + 1] = gg < 0 ? 0 : gg > 255 ? 255 : gg;
          d[p + 2] = bb < 0 ? 0 : bb > 255 ? 255 : bb;
          d[p + 3] = 255;
          p += 4;
        }
      }
      ctx2.putImageData(img, 0, 0);
    }

    /* ================= WebGL ================= */

    var gl = null, isGL2 = false;
    var CTX_OPTS = { antialias: false, alpha: false };
    try {
      gl = cv.getContext("webgl2", CTX_OPTS);
      if (gl) isGL2 = true;
      else gl = cv.getContext("webgl", CTX_OPTS) ||
                cv.getContext("experimental-webgl", CTX_OPTS);
    } catch (e) { gl = null; }

    var VERT = [
      "attribute vec2 aP;",
      "varying vec2 vUv;",
      "void main() {",
      "  vUv = aP * 0.5 + 0.5;",
      "  gl_Position = vec4(aP, 0.0, 1.0);",
      "}"
    ].join("\n");

    var FRAG = [
      "precision highp float;",
      "uniform vec2 uRes;",
      "uniform float uTime;",
      "uniform float uStatic;",
      "uniform vec2 uOrigin;",
      "uniform float uPress;",
      "uniform vec4 uRip[10];",
      "uniform sampler2D uNoise;",
      "uniform sampler2D uFlow;",
      "uniform vec2 uFlowSize;",
      "",
      "vec3 ramp(float t) {",
      "  t = clamp(t, 0.0, 1.0);",
      "  vec3 c0 = vec3(0.0706, 0.2471, 0.2863);",
      "  vec3 c1 = vec3(0.1137, 0.3176, 0.3529);",
      "  vec3 c2 = vec3(0.9020, 0.6549, 0.3608);",
      "  vec3 c3 = vec3(0.9176, 0.4980, 0.1804);",
      "  vec3 c4 = vec3(1.0000, 0.5882, 0.2039);",
      "  vec3 c5 = vec3(0.8314, 0.2314, 0.0863);",
      "  vec3 c6 = vec3(0.2902, 0.0627, 0.0745);",
      "  vec3 c7 = vec3(0.0706, 0.0392, 0.0549);",
      "  if (t < 0.30) return mix(c0, c1, t / 0.30);",
      "  if (t < 0.52) return mix(c1, c2, (t - 0.30) / 0.22);",
      "  if (t < 0.62) return mix(c2, c3, (t - 0.52) / 0.10);",
      "  if (t < 0.70) return mix(c3, c4, (t - 0.62) / 0.08);",
      "  if (t < 0.78) return mix(c4, c5, (t - 0.70) / 0.08);",
      "  if (t < 0.88) return mix(c5, c6, (t - 0.78) / 0.10);",
      "  return mix(c6, c7, (t - 0.88) / 0.12);",
      "}",
      "",
      "float g2(vec2 w, vec2 c, vec2 s) {",
      "  vec2 d = (w - c) / s;",
      "  return exp(-dot(d, d));",
      "}",
      "",
      "void main() {",
      "  float minD = min(uRes.x, uRes.y);",
      "  float T = uTime * (1.0 - uStatic);",
      "  /* fluid: displace the sampling point by the advected offset map.",
      "     Smoothed bilinear lookup — plain bilinear creases at texel edges",
      "     when magnified, which reads as a blocky grid */",
      "  vec2 fst = (gl_FragCoord.xy / uRes) * uFlowSize - 0.5;",
      "  vec2 fi = floor(fst);",
      "  vec2 ff = fst - fi;",
      "  ff = ff * ff * (3.0 - 2.0 * ff);",
      "  vec2 fuv = (fi + 0.5 + ff) / uFlowSize;",
      "  vec2 p = gl_FragCoord.xy + texture2D(uFlow, fuv).rg * uRes;",
      "",
      "  /* ripples: travelling circular waves fired from the photo (and,",
      "     without the fluid sim, seeded along the pointer's path) */",
      "  float fBump = 0.0;",
      "  for (int i = 0; i < 10; i++) {",
      "    vec4 rp = uRip[i];",
      "    if (rp.z >= 0.0) {",
      "      float env = 1.0 - rp.z / 1.8;",
      "      if (env > 0.0) {",
      "        float s = rp.w;",
      "        float sq = sqrt(s);",
      "        vec2 rd = p - rp.xy;",
      "        float dist = length(rd) + 1e-4;",
      "        float rad = rp.z * 0.62 * minD * s;",
      "        float xx = (dist - rad) / (0.09 * minD * sq);",
      "        float ring = exp(-xx * xx);",
      "        p += (rd / dist) * ring * env * 0.045 * minD * sq;",
      "        fBump += 0.14 * ring * env * sq;",
      "      }",
      "    }",
      "  }",
      "",
      "  /* press: the photo pushes the liquid toward the teal floor */",
      "  vec2 od = (p - uOrigin) / (0.30 * minD);",
      "  float dent = exp(-dot(od, od)) * uPress;",
      "",
      "  vec2 q = p / uRes;",
      "  float u = q.x;",
      "  float v = 1.0 - q.y;",
      "  float wu = u + 0.045 * sin(v * 4.6 + 1.2 + T * 0.21) + 0.02 * sin(v * 10.3 + 3.1 - T * 0.17);",
      "  float wv = v + 0.055 * sin(u * 3.9 + 0.6 + T * 0.15) + 0.02 * sin(u * 8.3 + 5.0 + T * 0.23);",
      "  vec2 w = vec2(wu, wv);",
      "",
      "  float f = 0.60 + fBump - 0.30 * dent;",
      "  vec2 dr1 = 0.013 * vec2(sin(T * 0.11), cos(T * 0.10));",
      "  vec2 dr2 = 0.015 * vec2(sin(T * 0.09 + 2.1), cos(T * 0.12 + 1.0));",
      "  vec2 dr3 = 0.016 * vec2(sin(T * 0.10 + 4.0), cos(T * 0.08 + 0.7));",
      "  vec2 dr4 = 0.014 * vec2(sin(T * 0.12 + 5.3), cos(T * 0.09 + 3.6));",
      "  vec2 dr5 = 0.015 * vec2(sin(T * 0.08 + 1.6), cos(T * 0.11 + 5.1));",
      "  if (uRes.y > uRes.x) {",
      "    f += 0.62 * g2(w, vec2(0.82, 0.08) + dr1, vec2(0.42, 0.24));",
      "    f += 0.62 * g2(w, vec2(0.22, 0.98) + dr2, vec2(0.45, 0.26));",
      "    f -= 0.60 * g2(w, vec2(0.12, 0.40) + dr3, vec2(0.34, 0.16));",
      "    f -= 0.55 * g2(w, vec2(0.55, 0.52) + dr4, vec2(0.30, 0.15));",
      "    f -= 0.60 * g2(w, vec2(0.92, 0.62) + dr5, vec2(0.34, 0.16));",
      "    f += 0.10 * g2(w, vec2(0.02, 0.02), vec2(0.30, 0.18));",
      "    f += 0.10 * g2(w, vec2(0.98, 0.98), vec2(0.30, 0.18));",
      "  } else {",
      "    f += 0.62 * g2(w, vec2(0.78, 0.04) + dr1, vec2(0.26, 0.34));",
      "    f += 0.62 * g2(w, vec2(0.16, 1.00) + dr2, vec2(0.28, 0.38));",
      "    f -= 0.60 * g2(w, vec2(0.24, 0.42) + dr3, vec2(0.26, 0.22));",
      "    f -= 0.52 * g2(w, vec2(0.58, 0.56) + dr4, vec2(0.24, 0.20));",
      "    f -= 0.60 * g2(w, vec2(0.90, 0.66) + dr5, vec2(0.28, 0.22));",
      "    f += 0.10 * g2(w, vec2(0.02, 0.02), vec2(0.24, 0.26));",
      "    f += 0.10 * g2(w, vec2(0.99, 0.98), vec2(0.24, 0.26));",
      "  }",
      "",
      "  vec3 col = ramp(f);",
      "  col += fBump * 0.45;   /* light catching the wave crests */",
      "  float gr = texture2D(uNoise, gl_FragCoord.xy / 256.0).r;",
      "  col += (gr - 0.5) * 0.102;",
      "  gl_FragColor = vec4(col, 1.0);",
      "}"
    ].join("\n");

    /* --- fluid sim shaders (WebGL2 + float buffers only) --- */

    var FS_SPLAT = [
      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uTarget;",
      "uniform vec2 uPoint;",
      "uniform vec2 uValue;",
      "uniform float uRadius;",
      "uniform float uAspect;",
      "void main() {",
      "  vec2 d = vUv - uPoint;",
      "  d.x *= uAspect;",
      "  vec2 base = texture2D(uTarget, vUv).rg;",
      "  float g = exp(-dot(d, d) / uRadius);",
      "  gl_FragColor = vec4(base + uValue * g, 0.0, 1.0);",
      "}"
    ].join("\n");

    var FS_ADVECT_VEL = [
      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uVel;",
      "uniform float uDt;",
      "uniform float uDiss;",
      "void main() {",
      "  vec2 vel = texture2D(uVel, vUv).rg;",
      "  vec2 back = vUv - uDt * vel;",
      "  gl_FragColor = vec4(texture2D(uVel, back).rg * uDiss, 0.0, 1.0);",
      "}"
    ].join("\n");

    var FS_ADVECT_FLOW = [
      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uVel;",
      "uniform sampler2D uSrc;",
      "uniform float uDt;",
      "uniform float uRelax;",
      "void main() {",
      "  vec2 vel = texture2D(uVel, vUv).rg;",
      "  vec2 back = vUv - uDt * vel;",
      "  /* carry the offset with the flow and accumulate the displacement */",
      "  vec2 D = texture2D(uSrc, back).rg - uDt * vel;",
      "  gl_FragColor = vec4(D * (1.0 - uRelax), 0.0, 1.0);",
      "}"
    ].join("\n");

    var FS_DIVERGENCE = [
      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uVel;",
      "uniform vec2 uTexel;",
      "void main() {",
      "  float L = texture2D(uVel, vUv - vec2(uTexel.x, 0.0)).r;",
      "  float R = texture2D(uVel, vUv + vec2(uTexel.x, 0.0)).r;",
      "  float B = texture2D(uVel, vUv - vec2(0.0, uTexel.y)).g;",
      "  float T = texture2D(uVel, vUv + vec2(0.0, uTexel.y)).g;",
      "  gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);",
      "}"
    ].join("\n");

    var FS_PRESSURE = [
      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uPressure;",
      "uniform sampler2D uDiv;",
      "uniform vec2 uTexel;",
      "void main() {",
      "  float L = texture2D(uPressure, vUv - vec2(uTexel.x, 0.0)).r;",
      "  float R = texture2D(uPressure, vUv + vec2(uTexel.x, 0.0)).r;",
      "  float B = texture2D(uPressure, vUv - vec2(0.0, uTexel.y)).r;",
      "  float T = texture2D(uPressure, vUv + vec2(0.0, uTexel.y)).r;",
      "  float div = texture2D(uDiv, vUv).r;",
      "  gl_FragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);",
      "}"
    ].join("\n");

    var FS_GRADIENT = [
      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uPressure;",
      "uniform sampler2D uVel;",
      "uniform vec2 uTexel;",
      "void main() {",
      "  float L = texture2D(uPressure, vUv - vec2(uTexel.x, 0.0)).r;",
      "  float R = texture2D(uPressure, vUv + vec2(uTexel.x, 0.0)).r;",
      "  float B = texture2D(uPressure, vUv - vec2(0.0, uTexel.y)).r;",
      "  float T = texture2D(uPressure, vUv + vec2(0.0, uTexel.y)).r;",
      "  vec2 vel = texture2D(uVel, vUv).rg;",
      "  vel -= 0.5 * vec2(R - L, T - B);",
      "  gl_FragColor = vec4(vel, 0.0, 1.0);",
      "}"
    ].join("\n");

    function compile(type, src) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) return null;
      return sh;
    }

    function makeProgram(fsSrc) {
      var vs = compile(gl.VERTEX_SHADER, VERT);
      var fs = compile(gl.FRAGMENT_SHADER, fsSrc);
      if (!vs || !fs) return null;
      var pr = gl.createProgram();
      gl.attachShader(pr, vs);
      gl.attachShader(pr, fs);
      gl.bindAttribLocation(pr, 0, "aP");
      gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
      return pr;
    }

    var prog = null, uni = {};
    function initGL() {
      prog = makeProgram(FRAG);
      if (!prog) return false;
      gl.useProgram(prog);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      var names = ["uRes", "uTime", "uStatic", "uOrigin", "uPress", "uFlowSize"];
      for (var i = 0; i < names.length; i++) uni[names[i]] = gl.getUniformLocation(prog, names[i]);
      uni.uRip = gl.getUniformLocation(prog, "uRip[0]") || gl.getUniformLocation(prog, "uRip");
      // Real white-noise tile for the film grain (unit 0)
      var noise = new Uint8Array(256 * 256);
      var ns = 0x2545f491 | 0;
      for (var n = 0; n < noise.length; n++) {
        ns ^= ns << 13; ns ^= ns >>> 17; ns ^= ns << 5;
        noise[n] = ns & 255;
      }
      var tex = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 256, 256, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, noise);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      gl.uniform1i(gl.getUniformLocation(prog, "uNoise"), 0);
      // Zero flow texture (unit 1) — replaced by the sim's offset map
      var zero = gl.createTexture();
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, zero);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
      gl.uniform1i(gl.getUniformLocation(prog, "uFlow"), 1);
      noiseTex = tex;
      zeroTex = zero;
      return true;
    }

    var noiseTex = null, zeroTex = null;

    /* ---------- fluid sim ---------- */

    var fluid = null;

    function initFluid() {
      if (!isGL2) return null;
      if (!gl.getExtension("EXT_color_buffer_float")) return null;

      var progs = {
        splat: makeProgram(FS_SPLAT),
        advVel: makeProgram(FS_ADVECT_VEL),
        advFlow: makeProgram(FS_ADVECT_FLOW),
        div: makeProgram(FS_DIVERGENCE),
        press: makeProgram(FS_PRESSURE),
        grad: makeProgram(FS_GRADIENT)
      };
      for (var k in progs) if (!progs[k]) return null;

      var simH = 128, simW = 128, texel = [0, 0];
      var flowW = 128, flowH = 128;

      function makeTex(w, h, internal, format) {
        var t = gl.createTexture();
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, gl.HALF_FLOAT, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return t;
      }

      function makePair(w, h, internal, format) {
        var a = { tex: makeTex(w, h, internal, format), fbo: gl.createFramebuffer() };
        var b = { tex: makeTex(w, h, internal, format), fbo: gl.createFramebuffer() };
        gl.bindFramebuffer(gl.FRAMEBUFFER, a.fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, a.tex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, b.fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, b.tex, 0);
        var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return ok ? { r: a, w: b, swap: function () { var t = this.r; this.r = this.w; this.w = t; } } : null;
      }

      var vel = null, flow = null, prs = null, dvg = null;

      function alloc() {
        simH = 128;
        simW = Math.max(16, Math.round(simH * (W / H)));
        // The displayed offset map runs at higher res than the physics —
        // at sim res its bilinear upscale reads as a blocky grid
        flowH = Math.min(432, H);
        flowW = Math.max(16, Math.round(flowH * (W / H)));
        texel = [1 / simW, 1 / simH];
        vel = makePair(simW, simH, gl.RG16F, gl.RG);
        flow = makePair(flowW, flowH, gl.RG16F, gl.RG);
        prs = makePair(simW, simH, gl.R16F, gl.RED);
        dvg = makePair(simW, simH, gl.R16F, gl.RED);
        return vel && flow && prs && dvg;
      }
      if (!alloc()) return null;

      var u = {};
      function locs(pr, list) {
        var o = {};
        for (var i = 0; i < list.length; i++) o[list[i]] = gl.getUniformLocation(pr, list[i]);
        return o;
      }
      u.splat = locs(progs.splat, ["uTarget", "uPoint", "uValue", "uRadius", "uAspect"]);
      u.advVel = locs(progs.advVel, ["uVel", "uDt", "uDiss"]);
      u.advFlow = locs(progs.advFlow, ["uVel", "uSrc", "uDt", "uRelax"]);
      u.div = locs(progs.div, ["uVel", "uTexel"]);
      u.press = locs(progs.press, ["uPressure", "uDiv", "uTexel"]);
      u.grad = locs(progs.grad, ["uPressure", "uVel", "uTexel"]);

      function bindTex(unit, tex) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, tex);
      }

      function pass(pr, fbo, w, h) {
        gl.useProgram(pr);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, w || simW, h || simH);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      var queue = [];   // pending splats {x, y (uv), vx, vy (uv/s)}

      function step(dt) {
        // 1. self-advect velocity
        gl.useProgram(progs.advVel);
        gl.uniform1f(u.advVel.uDt, dt);
        gl.uniform1f(u.advVel.uDiss, 0.985);
        bindTex(2, vel.r.tex);
        gl.uniform1i(u.advVel.uVel, 2);
        pass(progs.advVel, vel.w.fbo);
        vel.swap();
        // 2. inject the queued pointer forces
        while (queue.length) {
          var q = queue.shift();
          gl.useProgram(progs.splat);
          gl.uniform2f(u.splat.uPoint, q.x, q.y);
          gl.uniform2f(u.splat.uValue, q.vx, q.vy);
          gl.uniform1f(u.splat.uRadius, q.r || 0.0016);
          gl.uniform1f(u.splat.uAspect, W / H);
          bindTex(2, vel.r.tex);
          gl.uniform1i(u.splat.uTarget, 2);
          pass(progs.splat, vel.w.fbo);
          vel.swap();
        }
        // 3. pressure projection (incompressible -> the swirls)
        gl.useProgram(progs.div);
        gl.uniform2f(u.div.uTexel, texel[0], texel[1]);
        bindTex(2, vel.r.tex);
        gl.uniform1i(u.div.uVel, 2);
        pass(progs.div, dvg.w.fbo);
        dvg.swap();
        gl.useProgram(progs.press);
        gl.uniform2f(u.press.uTexel, texel[0], texel[1]);
        bindTex(3, dvg.r.tex);
        gl.uniform1i(u.press.uDiv, 3);
        for (var i = 0; i < 18; i++) {
          bindTex(2, prs.r.tex);
          gl.uniform1i(u.press.uPressure, 2);
          pass(progs.press, prs.w.fbo);
          prs.swap();
        }
        gl.useProgram(progs.grad);
        gl.uniform2f(u.grad.uTexel, texel[0], texel[1]);
        bindTex(2, prs.r.tex);
        gl.uniform1i(u.grad.uPressure, 2);
        bindTex(3, vel.r.tex);
        gl.uniform1i(u.grad.uVel, 3);
        pass(progs.grad, vel.w.fbo);
        vel.swap();
        // 4. advect the display offset map with the flow, relaxing home
        gl.useProgram(progs.advFlow);
        gl.uniform1f(u.advFlow.uDt, dt);
        gl.uniform1f(u.advFlow.uRelax, 0.012);
        bindTex(2, vel.r.tex);
        gl.uniform1i(u.advFlow.uVel, 2);
        bindTex(3, flow.r.tex);
        gl.uniform1i(u.advFlow.uSrc, 3);
        pass(progs.advFlow, flow.w.fbo, flowW, flowH);
        flow.swap();
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }

      return {
        step: step,
        realloc: alloc,
        queue: queue,
        flowTex: function () { return flow.r.tex; },
        flowSize: function () { return [flowW, flowH]; }
      };
    }

    /* ---- interaction state ---- */
    var press = 0, pressTarget = 0;
    var origin = { x: 0, y: 0 };
    var rip = [];                 // analytic ripples { x, y, t0, s, rate }
    var lastT = 0;
    var touchTime = -1e9;
    var lastSX = -1e5, lastSY = -1e5, lastSpawnT = 0;
    var pmx = -1e5, pmy = -1e5;   // previous pointer (client px) for fluid force

    // Fluid path: inject the pointer's motion as force into the liquid
    function pushForce(cx, cy) {
      if (pmx < -1e4) { pmx = cx; pmy = cy; return; }
      var dx = cx - pmx, dy = cy - pmy;
      pmx = cx; pmy = cy;
      if (dx === 0 && dy === 0) return;
      var ux = cx / window.innerWidth;
      var uy = 1 - cy / window.innerHeight;
      var vx = (dx / window.innerWidth) * 42;
      var vy = (-dy / window.innerHeight) * 42;
      var mag = Math.sqrt(vx * vx + vy * vy);
      if (mag > 1.4) { vx *= 1.4 / mag; vy *= 1.4 / mag; }
      fluid.queue.push({ x: ux, y: uy, vx: vx, vy: vy });
      if (fluid.queue.length > 24) fluid.queue.shift();
    }

    // Fallback path (no fluid): seed a small ripple along the pointer's path
    function spawnTrail(cx, cy) {
      var now = Date.now();
      var dx = cx - lastSX, dy = cy - lastSY;
      if (dx * dx + dy * dy < 90 * 90) return;
      if (now - lastSpawnT < 130) return;
      lastSX = cx; lastSY = cy; lastSpawnT = now;
      var pd = toDev(cx, cy);
      rip.push({ x: pd[0], y: pd[1], t0: lastT, s: 0.45, rate: 1.5 });
      if (rip.length > 10) rip.shift();
    }

    function updateOrigin() {
      if (avatarEl) {
        var r = avatarEl.getBoundingClientRect();
        if (r.width) {
          var pt = toDev(r.left + r.width / 2, r.top + r.height / 2);
          origin.x = pt[0];
          origin.y = pt[1];
          return;
        }
      }
      origin.x = W / 2;
      origin.y = H / 2;
    }

    function burst() {
      if (reduceMotion) return;
      rip.push({ x: origin.x, y: origin.y, t0: lastT, s: 1, rate: 1 });
      if (rip.length > 10) rip.shift();
      if (fluid) {
        // radial impulse: the wave also stirs the liquid outward
        var ux = origin.x / W, uy = origin.y / H;
        for (var i = 0; i < 10; i++) {
          var a = (i / 10) * Math.PI * 2;
          var dx = Math.cos(a), dy = Math.sin(a);
          fluid.queue.push({
            x: ux + dx * 0.03, y: uy + dy * 0.03,
            vx: dx * 0.8, vy: dy * 0.8, r: 0.0022
          });
        }
      }
      if (avatarEl) {
        avatarEl.classList.remove("is-pulsing");
        void avatarEl.offsetWidth;   // reflow so the ring animation re-triggers
        avatarEl.classList.add("is-pulsing");
      }
    }

    var ripData = new Float32Array(40);
    function drawGL(t, isStatic, dt) {
      lastT = t;
      press += (pressTarget - press) * 0.10;
      if (fluid && !isStatic && dt > 0) fluid.step(Math.min(dt, 1 / 30));
      for (var i = 0; i < 10; i++) {
        var r = rip[i];
        var age = r ? (t - r.t0) * r.rate : -1;
        if (r && age >= 0 && age <= 1.8) {
          ripData[i * 4] = r.x;
          ripData[i * 4 + 1] = r.y;
          ripData[i * 4 + 2] = age;
          ripData[i * 4 + 3] = r.s;
        } else {
          ripData[i * 4 + 2] = -1;
        }
      }
      gl.useProgram(prog);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, noiseTex);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, fluid ? fluid.flowTex() : zeroTex);
      gl.viewport(0, 0, W, H);
      gl.uniform2f(uni.uRes, W, H);
      gl.uniform1f(uni.uTime, t);
      gl.uniform1f(uni.uStatic, isStatic ? 1 : 0);
      gl.uniform2f(uni.uOrigin, origin.x, origin.y);
      gl.uniform1f(uni.uPress, press);
      if (fluid) {
        var fs = fluid.flowSize();
        gl.uniform2f(uni.uFlowSize, fs[0], fs[1]);
      } else {
        gl.uniform2f(uni.uFlowSize, 1, 1);
      }
      gl.uniform4fv(uni.uRip, ripData);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    /* ---- boot: pick the path ---- */
    if (!gl || !initGL()) {
      gl = null;
      var deb2 = null;
      window.addEventListener("resize", function () {
        clearTimeout(deb2);
        deb2 = setTimeout(function () { sizeCanvas(); render2d(); }, 180);
      }, { passive: true });
      sizeCanvas();
      render2d();
      return;
    }

    sizeCanvas();
    if (!reduceMotion) fluid = initFluid();

    var raf = null, start = 0, prevNow = 0;
    function frame(now) {
      if (!start) { start = now; prevNow = now; }
      var dt = (now - prevNow) * 0.001;
      prevNow = now;
      drawGL((now - start) * 0.001, false, dt);
      raf = requestAnimationFrame(frame);
    }

    function resize() {
      sizeCanvas();
      updateOrigin();
      if (fluid) fluid.realloc();
      if (reduceMotion) drawGL(1.2, true, 0);
    }

    function ensureRunning() {
      if (document.hidden) return;
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      resize();
      if (reduceMotion) { drawGL(1.2, true, 0); return; }
      start = 0;
      raf = requestAnimationFrame(frame);
    }

    /* the pointer stirs the liquid (fluid) / seeds ripples (fallback) */
    function onMouseMove(e) {
      if (Date.now() - touchTime < 700) return;   // ghost mouse after touch
      if (fluid) pushForce(e.clientX, e.clientY);
      else spawnTrail(e.clientX, e.clientY);
    }
    // Touch equivalent of :hover — fill the button under the finger
    function highlightButtonAt(x, y) {
      var el = document.elementFromPoint(x, y);
      var btn = el && el.closest ? el.closest(".social-button") : null;
      for (var b = 0; b < buttons.length; b++) {
        buttons[b].classList.toggle("is-active", buttons[b] === btn);
      }
    }
    function onTouchStart(e) {
      touchTime = Date.now();
      var t = e.touches && e.touches[0];
      if (!t) return;
      pmx = -1e5; pmy = -1e5;
      lastSX = -1e5; lastSY = -1e5;
      if (fluid) pushForce(t.clientX, t.clientY);
      else spawnTrail(t.clientX, t.clientY);
      highlightButtonAt(t.clientX, t.clientY);
    }
    function onTouchMove(e) {
      touchTime = Date.now();
      var t = e.touches && e.touches[0];
      if (!t) return;
      if (fluid) pushForce(t.clientX, t.clientY);
      else spawnTrail(t.clientX, t.clientY);
      highlightButtonAt(t.clientX, t.clientY);
    }
    function clearTouch() {
      touchTime = Date.now();
      pmx = -1e5; pmy = -1e5;
      for (var b = 0; b < buttons.length; b++) buttons[b].classList.remove("is-active");
    }

    if (!reduceMotion) {
      window.addEventListener("mousemove", onMouseMove, { passive: true });
      window.addEventListener("touchstart", onTouchStart, { passive: true });
      window.addEventListener("touchmove", onTouchMove, { passive: true });
      window.addEventListener("touchend", clearTouch, { passive: true });
      window.addEventListener("touchcancel", clearTouch, { passive: true });
      document.documentElement.addEventListener("mouseleave", function () {
        pressTarget = 0;
        pmx = -1e5; pmy = -1e5;
      });
      window.addEventListener("blur", function () {
        pressTarget = 0;
        pmx = -1e5; pmy = -1e5;
      });
    }

    /* press -> release -> ripple on the photo */
    if (avatarEl) {
      avatarEl.addEventListener("mouseenter", function () {
        if (Date.now() - touchTime < 700) return;
        if (!reduceMotion) pressTarget = 1;
      });
      avatarEl.addEventListener("mouseleave", function () {
        if (Date.now() - touchTime < 700) return;
        pressTarget = 0;
        burst();
      });
      // No sustained hover on touch — a tap is press + release in one
      avatarEl.addEventListener("touchstart", burst, { passive: true });
    }

    window.addEventListener("resize", resize, { passive: true });
    window.addEventListener("load", updateOrigin);

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      } else {
        ensureRunning();
      }
    });
    window.addEventListener("pageshow", ensureRunning);
    window.addEventListener("focus", ensureRunning);
    cv.addEventListener("webglcontextlost", function (e) {
      e.preventDefault();
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    });
    cv.addEventListener("webglcontextrestored", function () {
      if (initGL()) {
        if (!reduceMotion) fluid = initFluid();
        ensureRunning();
      }
    });

    // React to motion-preference changes live
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
      var onMq = function () {
        reduceMotion = mq.matches;
        if (reduceMotion) {
          if (raf) { cancelAnimationFrame(raf); raf = null; }
          press = 0; pressTarget = 0; rip = [];
          drawGL(1.2, true, 0);
        } else if (!raf) {
          if (!fluid) fluid = initFluid();
          start = 0;
          raf = requestAnimationFrame(frame);
        }
      };
      if (mq.addEventListener) mq.addEventListener("change", onMq);
      else if (mq.addListener) mq.addListener(onMq);
    }

    // Boot
    resize();
    if (reduceMotion) {
      drawGL(1.2, true, 0);
    } else {
      raf = requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
</html>
