  <!-- Adobe Fonts (brand lockup): Anzeigen Grotesk + Corporate A italic.
       Tied to the Creative Cloud subscription — Anton/Instrument (above) stay
       as free fallbacks, so the lockup degrades gracefully if the kit dies. -->

  <style>
    :root {
      /* Type */
      --font-display: 'anzeigen-grotesk', 'Anton', sans-serif;
      --font-body:    'corporate-a', 'Instrument Serif', Georgia, serif;
      --font-sans:    'corporate-s', -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-mono:    'IBM Plex Mono', ui-monospace, monospace;
      /* Colour */
      --ink:       #0a0a0b;        /* page background       */
      --panel:     #121214;        /* raised surface        */
      --paper:     #f5f6f7;        /* primary text          */
      --soft:      #c7c7cc;        /* secondary text        */
      --grey:      #9a9a9f;        /* tertiary / meta text  */
      --paper-rgb: 245, 246, 247;  /* for translucent fills */
      --line:      rgba(var(--paper-rgb), 0.12);  /* hairlines */
      /* Shape & layout */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --reading:   680px;
      /* Spacing (4-based scale) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      font-family: var(--font-body);
      color: var(--paper);
      text-align: center;
      /* No-JS fallback: warm eclipse faces and dark inner rims frame the
         same petrol-teal channel drawn by the canvas. */
      background-color: #132d31;
      background:
        radial-gradient(ellipse 122% 105% at -32% -34%, #6a604e 30%, #887759 38%, #c48c54 46%, #ea9543 54%, #ec8a40 60%, #ed6a30 66%, #ec361f 72%, #d81920 76%, #901a22 80%, #43171e 84%, #201218 88%, #251318 90%, #7e1a20 92%, #d12f22 93%, #e5642f 94%, #e98540 95%, #d58c4c 96%, rgba(123, 114, 87, 0.86) 98%, rgba(51, 84, 82, 0.66) 100%, rgba(25, 65, 69, 0.22) 102%, transparent 104%),
        radial-gradient(ellipse 122% 105% at 132% 134%, #6a604e 30%, #887759 38%, #c48c54 46%, #ea9543 54%, #ec8a40 60%, #ed6a30 66%, #ec361f 72%, #d81920 76%, #901a22 80%, #43171e 84%, #201218 88%, #251318 90%, #7e1a20 92%, #d12f22 93%, #e5642f 94%, #e98540 95%, #d58c4c 96%, rgba(123, 114, 87, 0.86) 98%, rgba(51, 84, 82, 0.66) 100%, rgba(25, 65, 69, 0.22) 102%, transparent 104%),
        linear-gradient(145deg, #183b3f 0%, #10272b 50%, #17383c 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
      overscroll-behavior: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 20px;
    }
    /* Portrait follows the reference more literally: opposite arcs leave a
       sinuous teal channel between them. */
    @media (orientation: portrait) {
      body {
        background:
          radial-gradient(ellipse 142.3% 85.4% at -27.6% -27.9%, #6a604e 30%, #887759 38%, #c48c54 46%, #ea9543 54%, #ec8a40 60%, #ed6a30 66%, #ec361f 72%, #d81920 76%, #901a22 80%, #43171e 84%, #201218 88%, #251318 90%, #7e1a20 92%, #d12f22 93%, #e5642f 94%, #e98540 95%, #d58c4c 96%, rgba(123, 114, 87, 0.86) 98%, rgba(51, 84, 82, 0.66) 100%, rgba(25, 65, 69, 0.22) 102%, transparent 104%),
          radial-gradient(ellipse 142.3% 85.4% at 127.6% 127.9%, #6a604e 30%, #887759 38%, #c48c54 46%, #ea9543 54%, #ec8a40 60%, #ed6a30 66%, #ec361f 72%, #d81920 76%, #901a22 80%, #43171e 84%, #201218 88%, #251318 90%, #7e1a20 92%, #d12f22 93%, #e5642f 94%, #e98540 95%, #d58c4c 96%, rgba(123, 114, 87, 0.86) 98%, rgba(51, 84, 82, 0.66) 100%, rgba(25, 65, 69, 0.22) 102%, transparent 104%),
          linear-gradient(150deg, #183b3f 0%, #10272b 50%, #17383c 100%);
      }
    }

    /* Liquid tonal field: WebGL when available (animated, mouse-reactive),
       otherwise a single static 2D render. The CSS gradients on body are
       the no-JS fallback. */
    canvas#field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      display: block;
      pointer-events: none;
    }

    /* ===== Content: no card, flat elements floating over the mesh ===== */
    .stage {
      position: relative;
      z-index: 1;
      width: min(460px, 92vw);
    }

    .avatar {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 22px;
      cursor: inherit;                    /* keep the custom arrow */
      isolation: isolate;
      transform-origin: center;
      transition: transform 0.62s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    /* Chromatic rim borrowed from the liquid-field palette. */
    .avatar::before {
      content: "";
      position: absolute;
      inset: -7px;
      z-index: 0;
      border-radius: 50%;
      background: conic-gradient(
        from -38deg,
        #ffc37a 0 15%,
        #ff4c20 22% 39%,
        #59151f 47% 61%,
        #0d525a 69% 88%,
        #ffc37a 96% 100%
      );
      opacity: 0.62;
      transform: rotate(-14deg) scale(0.97);
      filter: saturate(0.9) drop-shadow(0 10px 22px rgba(0, 0, 0, 0.46));
      pointer-events: none;
      transition:
        transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1),
        opacity 0.45s ease,
        filter 0.55s ease;
    }
    /* Warm/cool wash ties the portrait itself to the background. */
    .avatar::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 50%;
      background:
        radial-gradient(circle at 28% 22%, rgba(255, 195, 122, 0.5), transparent 36%),
        linear-gradient(145deg, rgba(255, 64, 24, 0.3), transparent 56%, rgba(7, 77, 84, 0.38));
      mix-blend-mode: soft-light;
      opacity: 0.12;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }
    .profile-image {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      box-shadow: 0 0 0 1px var(--line), 0 14px 32px -22px rgba(0, 0, 0, 0.85);
      filter: saturate(0.94) contrast(1.02);
      transition:
        filter 0.5s ease,
        box-shadow 0.55s ease;
    }
    @media (hover: hover) {
      .avatar:hover {
        transform: scale(1.04);
      }
      .avatar:hover::before {
        transform: rotate(34deg) scale(1);
        opacity: 1;
        filter: saturate(1.14) drop-shadow(0 14px 28px rgba(0, 0, 0, 0.5));
      }
      .avatar:hover .profile-image {
        filter: brightness(1.03) saturate(1.14) contrast(1.08);
        box-shadow:
          0 22px 44px -22px rgba(0, 0, 0, 0.88),
          -12px -8px 28px -22px rgba(255, 76, 32, 0.95),
          12px 10px 30px -22px rgba(22, 105, 114, 0.95);
      }
      .avatar:hover::after {
        opacity: 0.72;
      }
    }

    /* Brand lockup (identity pair: Anzeigen Grotesk + Corporate A italic,
       falling back to their free lookalikes Anton + Instrument Serif):
       name in condensed caps on one line, italic tagline right under it */
    h1 {
      font-family: var(--font-display);
      font-weight: 400;                 /* single-weight faces — never synthesize */
      font-synthesis: none;
      font-size: clamp(34px, 10.5vw, 62px);
      line-height: 1;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: var(--paper);
      margin: 0;
      text-shadow: 0 1px 30px rgba(0, 0, 0, 0.9), 0 1px 3px rgba(0, 0, 0, 0.7);
    }
    .tagline {
      font-family: var(--font-body);
      font-style: italic;
      font-weight: 300;   /* resolves to Light Italic once it's in the kit; 400 until then */
      font-size: clamp(16px, 4vw, 21px);
      color: rgba(var(--paper-rgb), 0.75);
      margin: 0.08em 0 34px;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(0, 0, 0, 0.85);
    }
    /* Tagline voices: "creative mind" upright and brightest, the rest
       italic stepped back, "fun" as the single colour accent (the ramp's sand) */
    .tagline-quiet { font-style: normal; color: var(--paper); }
    .tagline-dot { color: rgba(var(--paper-rgb), 0.45); }
    .tagline-accent { color: #ffc37a; }

    /* Flat buttons — no glass, no blur, no shadow, no depth */
    .links {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      max-width: 320px;
      margin: 0 auto;
    }

    .social-button {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      text-align: center;
      text-decoration: none;
      color: var(--paper);
      font-family: var(--font-sans);   /* Corporate S Bold — the family's UI sans */
      font-weight: 700;
      font-synthesis: none;
      font-size: 17px;
      letter-spacing: 0.01em;
      background: rgba(var(--paper-rgb), 0.10);
      border: 1px solid rgba(var(--paper-rgb), 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      -webkit-tap-highlight-color: transparent;
      transition: color 0.35s ease, border-color 0.35s ease;
    }
    /* White fill that wipes in from the left on hover; text turns dark */
    .social-button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--paper);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .social-button:focus-visible,
    .social-button.is-active {
      color: var(--ink);
      border-color: var(--paper);
    }
    .social-button:focus-visible::before,
    .social-button.is-active::before {
      transform: scaleX(1);
    }
    /* Real hover only on pointer devices — avoids sticky hover on touch */
    @media (hover: hover) {
      .social-button:hover {
        color: var(--ink);
        border-color: var(--paper);
      }
      .social-button:hover::before {
        transform: scaleX(1);
      }
    }
    .social-button:focus-visible {
      outline: 2px solid rgba(var(--paper-rgb), 0.8);
      outline-offset: 3px;
    }

    @media (max-width: 380px) {
      .avatar { width: 104px; height: 104px; }
      .social-button { font-size: 16px; padding: 13px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .social-button, .social-button::before, .avatar, .profile-image, .avatar::before, .avatar::after { transition: none; }
      .avatar:hover, .avatar:hover .profile-image, .avatar:hover::before, .avatar:hover::after { transform: none; }
    }
  </style>

<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <main class="stage">
    <span class="avatar">
      <img src="profile.jpg" alt="Profile picture of Eduardo Sanches" class="profile-image" width="120" height="120" decoding="async" />
    </span>

    <h1>eduardo sanches</h1>
    <p class="tagline"><span class="tagline-quiet">creative mind</span> <span class="tagline-dot">&bull;</span> building things for <span class="tagline-accent">fun</span></p>

    <nav class="links" aria-label="Social links">
      <a class="social-button" href="https://x.com/oeduardosanches" target="_blank" rel="noopener noreferrer">X</a>
      <a class="social-button" href="https://instagram.com/_eduardosanches" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="social-button" href="https://www.youtube.com/@eduardo_sanches" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a class="social-button" href="/blog/">Blog</a>
    </nav>
  </main>

  <script>
  // Liquid tonal field.
  // Display: two cropped elliptic-distance fields + a sampled radial colour
  // profile, light domain warp and film grain rendered by a fragment shader.
  // The photo press/ripple and the slow autonomous drift live here.
  // Fluid: when WebGL2 + float buffers are available, a real Navier-Stokes
  // simulation (velocity advection + pressure projection on a small grid)
  // warps the field's sampling coordinates — the mouse genuinely stirs the
  // liquid and it swirls, spreads and settles back on its own.
  // Fallbacks: WebGL1 -> same display, ripple-trail instead of fluid;
  // no WebGL -> one static 2D render; no JS -> the CSS gradients on body.
  (function () {
    "use strict";

    var cv = document.getElementById("field");
    if (!cv) return;

    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var avatarEl = document.querySelector(".avatar");
    var buttons = document.querySelectorAll(".social-button");

    var DPR = 1, W = 0, H = 0;

    function sizeCanvas() {
      DPR = Math.max(1, Math.min(1.5, window.devicePixelRatio || 1));
      W = Math.max(1, Math.round(window.innerWidth * DPR));
      H = Math.max(1, Math.round(window.innerHeight * DPR));
      var CAP = 4200000;
      if (W * H > CAP) {
        var s = Math.sqrt(CAP / (W * H));
        W = Math.round(W * s);
        H = Math.round(H * s);
      }
      cv.width = W;
      cv.height = H;
      cv.style.width = window.innerWidth + "px";
      cv.style.height = window.innerHeight + "px";
    }

    // window px -> device px (canvas coords, y up like gl_FragCoord)
    function toDev(cx, cy) {
      return [cx * (W / window.innerWidth), H - cy * (H / window.innerHeight)];
    }

    /* ================= static 2D fallback ================= */

    var R_MIN = 0.30, R_MAX = 1.12;
    var STOPS = [
      [0.30, 106, 96, 78], [0.38, 136, 119, 89], [0.46, 196, 140, 84],
      [0.54, 234, 149, 67], [0.60, 236, 138, 64], [0.66, 237, 106, 48],
      [0.72, 236, 54, 31], [0.76, 216, 25, 32], [0.80, 144, 26, 34],
      [0.84, 67, 23, 30], [0.88, 32, 18, 24], [0.90, 37, 19, 24],
      [0.92, 126, 26, 32], [0.93, 209, 47, 34], [0.94, 229, 100, 47],
      [0.95, 233, 133, 64], [0.96, 213, 140, 76], [0.98, 123, 114, 87],
      [1.00, 51, 84, 82], [1.02, 25, 65, 69], [1.05, 18, 47, 51],
      [1.08, 19, 38, 42], [1.12, 21, 44, 48]
    ];

    function ellipseRadius(u, v, cx, cy, sx, sy) {
      var dx = (u - cx) / sx, dy = (v - cy) / sy;
      return Math.sqrt(dx * dx + dy * dy);
    }

    /* The reference is two huge cropped ellipses, not two closed rings.
       Their shared radial profile runs warm -> red -> dark -> hot rim -> teal. */
    function radiusField(u, v, portrait) {
      var a, b;
      if (portrait) {
        a = ellipseRadius(u, v, -0.276, -0.279, 1.423, 0.854);
        b = ellipseRadius(u, v, 1.276, 1.279, 1.423, 0.854);
      } else {
        a = ellipseRadius(u, v, -0.32, -0.34, 1.22, 1.05);
        b = ellipseRadius(u, v, 1.32, 1.34, 1.22, 1.05);
      }
      return Math.min(a, b);
    }

    function render2d() {
      var ctx2 = cv.getContext("2d", { alpha: false });
      if (!ctx2) return;
      var LUT = new Uint8Array(1024 * 3);
      for (var i = 0; i < 1024; i++) {
        var t = R_MIN + (R_MAX - R_MIN) * (i / 1023), s = 0;
        while (s < STOPS.length - 2 && t > STOPS[s + 1][0]) s++;
        var a = STOPS[s], b = STOPS[s + 1];
        var k = (t - a[0]) / (b[0] - a[0]);
        k = k < 0 ? 0 : k > 1 ? 1 : k;
        LUT[i * 3] = a[1] + (b[1] - a[1]) * k;
        LUT[i * 3 + 1] = a[2] + (b[2] - a[2]) * k;
        LUT[i * 3 + 2] = a[3] + (b[3] - a[3]) * k;
      }
      var STEP = 4;
      var portrait = H > W;
      var gw = Math.ceil(W / STEP) + 2, gh = Math.ceil(H / STEP) + 2;
      var field = new Float32Array(gw * gh);
      for (var gy = 0; gy < gh; gy++) {
        var v = (gy * STEP) / H;
        for (var gx = 0; gx < gw; gx++) {
          var u = (gx * STEP) / W;
          var wu = u + 0.010 * Math.sin(v * 4.6 + 1.2) + 0.003 * Math.sin(v * 10.3 + 3.1);
          var wv = v + 0.012 * Math.sin(u * 3.9 + 0.6) + 0.003 * Math.sin(u * 8.3 + 5.0);
          field[gy * gw + gx] = radiusField(wu, wv, portrait);
        }
      }
      var img = ctx2.createImageData(W, H);
      var d = img.data;
      var seed = 0x9e3779b9 | 0;
      var p = 0;
      for (var y = 0; y < H; y++) {
        var fy = y / STEP, y0 = fy | 0, ty = fy - y0;
        var r0 = y0 * gw, r1 = r0 + gw;
        for (var x = 0; x < W; x++) {
          var fx = x / STEP, x0 = fx | 0, tx = fx - x0;
          var f00 = field[r0 + x0], f10 = field[r0 + x0 + 1];
          var f01 = field[r1 + x0], f11 = field[r1 + x0 + 1];
          var top = f00 + (f10 - f00) * tx;
          var bot = f01 + (f11 - f01) * tx;
          var radius = top + (bot - top) * ty;
          var tt = (radius - R_MIN) / (R_MAX - R_MIN);
          tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
          var idx = ((tt * 1023) | 0) * 3;
          seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
          var goldGrain = 36 * Math.exp(-Math.pow((radius - 0.56) / 0.17, 2));
          var redGrain = 10 * Math.exp(-Math.pow((radius - 0.72) / 0.10, 2));
          var n = ((seed & 255) / 255 - 0.5) * (46 + goldGrain + redGrain);
          var rr = LUT[idx] + n, gg = LUT[idx + 1] + n, bb = LUT[idx + 2] + n;
          d[p] = rr < 0 ? 0 : rr > 255 ? 255 : rr;
          d[p + 1] = gg < 0 ? 0 : gg > 255 ? 255 : gg;
          d[p + 2] = bb < 0 ? 0 : bb > 255 ? 255 : bb;
          d[p + 3] = 255;
          p += 4;
        }
      }
      ctx2.putImageData(img, 0, 0);
    }

    /* ================= WebGL ================= */

    var gl = null, isGL2 = false;
    var CTX_OPTS = { antialias: false, alpha: false };
    try {
      gl = cv.getContext("webgl2", CTX_OPTS);
      if (gl) isGL2 = true;
      else gl = cv.getContext("webgl", CTX_OPTS) ||
                cv.getContext("experimental-webgl", CTX_OPTS);
    } catch (e) { gl = null; }

    var VERT = [
      "attribute vec2 aP;",
      "varying vec2 vUv;",
      "void main() {",
      "  vUv = aP * 0.5 + 0.5;",
      "  gl_Position = vec4(aP, 0.0, 1.0);",
      "}"
    ].join("\n");

    var FRAG = [
      "precision highp float;",
      "uniform vec2 uRes;",
      "uniform float uTime;",
      "uniform float uStatic;",
      "uniform vec2 uOrigin;",
      "uniform float uPress;",
      "uniform vec4 uRip[10];",
      "uniform sampler2D uNoise;",
      "uniform sampler2D uFlow;",
      "uniform vec2 uFlowSize;",
      "",
      "vec3 orbRamp(float r) {",
      "  r = clamp(r, 0.30, 1.12);",
      "  vec3 c0  = vec3(0.4157, 0.3765, 0.3059);",
      "  vec3 c1  = vec3(0.5333, 0.4667, 0.3490);",
      "  vec3 c2  = vec3(0.7686, 0.5490, 0.3294);",
      "  vec3 c3  = vec3(0.9176, 0.5843, 0.2627);",
      "  vec3 c4  = vec3(0.9255, 0.5412, 0.2510);",
      "  vec3 c5  = vec3(0.9294, 0.4157, 0.1882);",
      "  vec3 c6  = vec3(0.9255, 0.2118, 0.1216);",
      "  vec3 c7  = vec3(0.8471, 0.0980, 0.1255);",
      "  vec3 c8  = vec3(0.5647, 0.1020, 0.1333);",
      "  vec3 c9  = vec3(0.2627, 0.0902, 0.1176);",
      "  vec3 c10 = vec3(0.1255, 0.0706, 0.0941);",
      "  vec3 c11 = vec3(0.1451, 0.0745, 0.0941);",
      "  vec3 c12 = vec3(0.4941, 0.1020, 0.1255);",
      "  vec3 c13 = vec3(0.8196, 0.1843, 0.1333);",
      "  vec3 c14 = vec3(0.8980, 0.3922, 0.1843);",
      "  vec3 c15 = vec3(0.9137, 0.5216, 0.2510);",
      "  vec3 c16 = vec3(0.8353, 0.5490, 0.2980);",
      "  vec3 c17 = vec3(0.4824, 0.4471, 0.3412);",
      "  vec3 c18 = vec3(0.2000, 0.3294, 0.3216);",
      "  vec3 c19 = vec3(0.0980, 0.2549, 0.2706);",
      "  vec3 c20 = vec3(0.0706, 0.1843, 0.2000);",
      "  vec3 c21 = vec3(0.0745, 0.1490, 0.1647);",
      "  vec3 c22 = vec3(0.0824, 0.1725, 0.1882);",
      "  if (r < 0.38) return mix(c0, c1, (r - 0.30) / 0.08);",
      "  if (r < 0.46) return mix(c1, c2, (r - 0.38) / 0.08);",
      "  if (r < 0.54) return mix(c2, c3, (r - 0.46) / 0.08);",
      "  if (r < 0.60) return mix(c3, c4, (r - 0.54) / 0.06);",
      "  if (r < 0.66) return mix(c4, c5, (r - 0.60) / 0.06);",
      "  if (r < 0.72) return mix(c5, c6, (r - 0.66) / 0.06);",
      "  if (r < 0.76) return mix(c6, c7, (r - 0.72) / 0.04);",
      "  if (r < 0.80) return mix(c7, c8, (r - 0.76) / 0.04);",
      "  if (r < 0.84) return mix(c8, c9, (r - 0.80) / 0.04);",
      "  if (r < 0.88) return mix(c9, c10, (r - 0.84) / 0.04);",
      "  if (r < 0.90) return mix(c10, c11, (r - 0.88) / 0.02);",
      "  if (r < 0.92) return mix(c11, c12, (r - 0.90) / 0.02);",
      "  if (r < 0.93) return mix(c12, c13, (r - 0.92) / 0.01);",
      "  if (r < 0.94) return mix(c13, c14, (r - 0.93) / 0.01);",
      "  if (r < 0.95) return mix(c14, c15, (r - 0.94) / 0.01);",
      "  if (r < 0.96) return mix(c15, c16, (r - 0.95) / 0.01);",
      "  if (r < 0.98) return mix(c16, c17, (r - 0.96) / 0.02);",
      "  if (r < 1.00) return mix(c17, c18, (r - 0.98) / 0.02);",
      "  if (r < 1.02) return mix(c18, c19, (r - 1.00) / 0.02);",
      "  if (r < 1.05) return mix(c19, c20, (r - 1.02) / 0.03);",

      "",
      "void main() {",
      "  float minD = min(uRes.x, uRes.y);",
      "  float T = uTime * (1.0 - uStatic);",
      "  /* fluid: displace the sampling point by the advected offset map.",
      "     Smoothed bilinear lookup — plain bilinear creases at texel edges",
      "     when magnified, which reads as a blocky grid */",
      "  vec2 fst = (gl_FragCoord.xy / uRes) * uFlowSize - 0.5;",
      "  vec2 fi = floor(fst);",
      "  vec2 ff = fst - fi;",
      "  ff = ff * ff * (3.0 - 2.0 * ff);",
      "  vec2 fuv = (fi + 0.5 + ff) / uFlowSize;",
      "  vec2 p = gl_FragCoord.xy + texture2D(uFlow, fuv).rg * uRes;",
      "",
      "  /* ripples: travelling circular waves fired from the photo (and,",
      "     without the fluid sim, seeded along the pointer's path) */",
      "  float fBump = 0.0;",
      "  for (int i = 0; i < 10; i++) {",
      "    vec4 rp = uRip[i];",
      "    if (rp.z >= 0.0) {",
      "      float env = 1.0 - rp.z / 1.8;",
      "      if (env > 0.0) {",
      "        float s = rp.w;",
      "        float sq = sqrt(s);",
      "        vec2 rd = p - rp.xy;",
      "        float dist = length(rd) + 1e-4;",
      "        float rad = rp.z * 0.62 * minD * s;",
      "        float xx = (dist - rad) / (0.09 * minD * sq);",
      "        float ring = exp(-xx * xx);",
      "        p += (rd / dist) * ring * env * 0.045 * minD * sq;",
      "        fBump += 0.14 * ring * env * sq;",
      "      }",
      "    }",
      "  }",
      "",
      "  /* press: the photo pushes the liquid toward the teal floor */",
      "  vec2 od = (p - uOrigin) / (0.30 * minD);",
      "  float dent = exp(-dot(od, od)) * uPress;",

      "  vec2 q = p / uRes;",
      "  float u = q.x;",
      "  float v = 1.0 - q.y;",
      "  float wu = u + 0.010 * sin(v * 4.6 + 1.2 + T * 0.21) + 0.003 * sin(v * 10.3 + 3.1 - T * 0.17);",

      "  vec2 w = vec2(wu, wv);",
      "",
      "  vec2 dr1 = 0.013 * vec2(sin(T * 0.11), cos(T * 0.10));",
      "  vec2 dr2 = 0.015 * vec2(sin(T * 0.09 + 2.1), cos(T * 0.12 + 1.0));",
      "  /* Elliptic distance recreates the two enormous cropped masses in",
      "     the reference. Their radial ramp contains both the dark edge and",
      "     the narrow red/gold halo before it reaches the teal channel. */",
      "  float rA, rB;",
      "  if (uRes.y > uRes.x) {",
      "    rA = length((w - (vec2(-0.276, -0.279) + dr1)) / vec2(1.423, 0.854));",
      "    rB = length((w - (vec2(1.276, 1.279) + dr2)) / vec2(1.423, 0.854));",
      "  } else {",
      "    rA = length((w - (vec2(-0.32, -0.34) + dr1)) / vec2(1.22, 1.05));",
      "    rB = length((w - (vec2(1.32, 1.34) + dr2)) / vec2(1.22, 1.05));",
      "  }",
      "  float radius = min(rA, rB);",
      "",
      "  vec3 col = orbRamp(radius);",
      "  col = mix(col, orbRamp(1.05), 0.52 * dent);",
      "  col += fBump * 0.40;   /* light catching the wave crests */",
      "  float gr = texture2D(uNoise, gl_FragCoord.xy / 256.0).r;",
      "  float gx = (radius - 0.56) / 0.17;",
      "  float rx = (radius - 0.72) / 0.10;",
      "  float grainAmp = 0.180 + 0.141 * exp(-gx * gx) + 0.039 * exp(-rx * rx);",
      "  col += (gr - 0.5) * grainAmp;",

      "}"

    /* --- fluid sim shaders (WebGL2 + float buffers only) --- */

    var FS_SPLAT = [
      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uTarget;",
      "uniform vec2 uPoint;",
      "uniform vec2 uValue;",
      "uniform float uRadius;",
      "uniform float uAspect;",
      "void main() {",
      "  vec2 d = vUv - uPoint;",
      "  d.x *= uAspect;",
      "  vec2 base = texture2D(uTarget, vUv).rg;",
      "  float g = exp(-dot(d, d) / uRadius);",

      "}"

      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uVel;",
      "uniform float uDt;",
      "uniform float uDiss;",
      "void main() {",
      "  vec2 vel = texture2D(uVel, vUv).rg;",
      "  vec2 back = vUv - uDt * vel;",

      "}"

      "varying vec2 vUv;",
      "uniform sampler2D uVel;",
      "uniform sampler2D uSrc;",
      "uniform float uDt;",
      "uniform float uRelax;",
      "void main() {",
      "  vec2 vel = texture2D(uVel, vUv).rg;",

      "  vec2 D = texture2D(uSrc, back).rg - uDt * vel;",

      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uVel;",
      "uniform vec2 uTexel;",
      "void main() {",
      "  float L = texture2D(uVel, vUv - vec2(uTexel.x, 0.0)).r;",
      "  float R = texture2D(uVel, vUv + vec2(uTexel.x, 0.0)).r;",
      "  float B = texture2D(uVel, vUv - vec2(0.0, uTexel.y)).g;",

      "}"
    ].join("\n");

      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uPressure;",
      "uniform sampler2D uDiv;",
      "uniform vec2 uTexel;",
      "void main() {",
      "  float L = texture2D(uPressure, vUv - vec2(uTexel.x, 0.0)).r;",
      "  float R = texture2D(uPressure, vUv + vec2(uTexel.x, 0.0)).r;",
      "  float B = texture2D(uPressure, vUv - vec2(0.0, uTexel.y)).r;",
      "  float T = texture2D(uPressure, vUv + vec2(0.0, uTexel.y)).r;",
      "  float div = texture2D(uDiv, vUv).r;",

      "precision highp float;",
      "varying vec2 vUv;",
      "uniform sampler2D uPressure;",
      "uniform sampler2D uVel;",
      "uniform vec2 uTexel;",
      "void main() {",
      "  float L = texture2D(uPressure, vUv - vec2(uTexel.x, 0.0)).r;",
      "  float R = texture2D(uPressure, vUv + vec2(uTexel.x, 0.0)).r;",
      "  float B = texture2D(uPressure, vUv - vec2(0.0, uTexel.y)).r;",
      "  float T = texture2D(uPressure, vUv + vec2(0.0, uTexel.y)).r;",

    function compile(type, src) {

    var prog = null, uni = {};
    function initGL() {

      gl.bindTexture(gl.TEXTURE_2D, zero);

        div: makeProgram(FS_DIVERGENCE),

      function makeTex(w, h, internal, format) {

        gl.activeTexture(gl.TEXTURE2);

        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, a.tex, 0);

        // at sim res its bilinear upscale reads as a blocky grid

        flowW = Math.max(16, Math.round(flowH * (W / H)));

        flow = makePair(flowW, flowH, gl.RG16F, gl.RG);

      var u = {};
      function locs(pr, list) {

        for (var i = 0; i < list.length; i++) o[list[i]] = gl.getUniformLocation(pr, list[i]);

      }
      u.splat = locs(progs.splat, ["uTarget", "uPoint", "uValue", "uRadius", "uAspect"]);
      u.advVel = locs(progs.advVel, ["uVel", "uDt", "uDiss"]);
      u.advFlow = locs(progs.advFlow, ["uVel", "uSrc", "uDt", "uRelax"]);
      u.div = locs(progs.div, ["uVel", "uTexel"]);
      u.press = locs(progs.press, ["uPressure", "uDiv", "uTexel"]);

          gl.uniform1i(u.splat.uTarget, 2);
          pass(progs.splat, vel.w.fbo);
          vel.swap();

        gl.uniform2f(u.div.uTexel, texel[0], texel[1]);

        gl.uniform1i(u.div.uVel, 2);

        dvg.swap();

        gl.uniform2f(u.grad.uTexel, texel[0], texel[1]);
        bindTex(2, prs.r.tex);
        gl.uniform1i(u.grad.uPressure, 2);
        bindTex(3, vel.r.tex);
        gl.uniform1i(u.grad.uVel, 3);
        pass(progs.grad, vel.w.fbo);
        vel.swap();
        // 4. advect the display offset map with the flow, relaxing home
        gl.useProgram(progs.advFlow);
        gl.uniform1f(u.advFlow.uDt, dt);
        gl.uniform1f(u.advFlow.uRelax, 0.012);
        bindTex(2, vel.r.tex);
        gl.uniform1i(u.advFlow.uVel, 2);
        bindTex(3, flow.r.tex);

    /* ---- interaction state ---- */
    var press = 0, pressTarget = 0;
    var origin = { x: 0, y: 0 };
    var rip = [];                 // analytic ripples { x, y, t0, s, rate }
    var lastT = 0;
    var touchTime = -1e9;
    var lastSX = -1e5, lastSY = -1e5, lastSpawnT = 0;

    // Fluid path: inject the pointer's motion as force into the liquid
    function pushForce(cx, cy) {

      var vy = (-dy / window.innerHeight) * 42;

    // Fallback path (no fluid): seed a small ripple along the pointer's path
    function spawnTrail(cx, cy) {
      var now = Date.now();
      var dx = cx - lastSX, dy = cy - lastSY;
      if (dx * dx + dy * dy < 90 * 90) return;
      if (now - lastSpawnT < 130) return;
      lastSX = cx; lastSY = cy; lastSpawnT = now;
      var pd = toDev(cx, cy);
      rip.push({ x: pd[0], y: pd[1], t0: lastT, s: 0.45, rate: 1.5 });
      if (rip.length > 10) rip.shift();
    }

    function updateOrigin() {
      if (avatarEl) {
        var r = avatarEl.getBoundingClientRect();
        if (r.width) {
          var pt = toDev(r.left + r.width / 2, r.top + r.height / 2);
          origin.x = pt[0];
          origin.y = pt[1];
          return;
        }
      }
      origin.x = W / 2;
      origin.y = H / 2;
    }

    function burst() {
      if (reduceMotion) return;
      rip.push({ x: origin.x, y: origin.y, t0: lastT, s: 1, rate: 1 });
      if (rip.length > 10) rip.shift();
      if (fluid) {
        // radial impulse: the wave also stirs the liquid outward
        var ux = origin.x / W, uy = origin.y / H;
        for (var i = 0; i < 10; i++) {
          var a = (i / 10) * Math.PI * 2;
          var dx = Math.cos(a), dy = Math.sin(a);
          fluid.queue.push({
            x: ux + dx * 0.03, y: uy + dy * 0.03,
            vx: dx * 0.8, vy: dy * 0.8, r: 0.0022
          });
        }
      }
    }

    var ripData = new Float32Array(40);
    function drawGL(t, isStatic, dt) {
      lastT = t;
      press += (pressTarget - press) * 0.10;
      if (fluid && !isStatic && dt > 0) fluid.step(Math.min(dt, 1 / 30));
      for (var i = 0; i < 10; i++) {
        var r = rip[i];
        var age = r ? (t - r.t0) * r.rate : -1;
        if (r && age >= 0 && age <= 1.8) {
          ripData[i * 4] = r.x;
          ripData[i * 4 + 1] = r.y;
          ripData[i * 4 + 2] = age;
          ripData[i * 4 + 3] = r.s;
        } else {
          ripData[i * 4 + 2] = -1;
        }
      }
      gl.useProgram(prog);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, noiseTex);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, fluid ? fluid.flowTex() : zeroTex);
      gl.viewport(0, 0, W, H);
      gl.uniform2f(uni.uRes, W, H);
      gl.uniform1f(uni.uTime, t);
      gl.uniform1f(uni.uStatic, isStatic ? 1 : 0);
      gl.uniform2f(uni.uOrigin, origin.x, origin.y);
      gl.uniform1f(uni.uPress, press);
      if (fluid) {
        var fs = fluid.flowSize();
        gl.uniform2f(uni.uFlowSize, fs[0], fs[1]);
      } else {
        gl.uniform2f(uni.uFlowSize, 1, 1);
      }
      gl.uniform4fv(uni.uRip, ripData);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    /* ---- boot: pick the path ---- */
    if (!gl || !initGL()) {
      gl = null;
      var deb2 = null;
      window.addEventListener("resize", function () {
        clearTimeout(deb2);
        deb2 = setTimeout(function () { sizeCanvas(); render2d(); }, 180);
      }, { passive: true });
      sizeCanvas();
      render2d();
      return;
    }

    sizeCanvas();
    if (!reduceMotion) fluid = initFluid();

    var raf = null, start = 0, prevNow = 0, resumed = false;
    function frame(now) {
      if (!start) { start = now; prevNow = now; }
      /* after a tab switch only dt restarts — the clock t must never rewind,
         or ripples stored with an older t0 replay out of nowhere */
      if (resumed) { prevNow = now; resumed = false; }
      var dt = (now - prevNow) * 0.001;
      prevNow = now;
      drawGL((now - start) * 0.001, false, dt);
      raf = requestAnimationFrame(frame);
    }

    function resize() {
      sizeCanvas();
      updateOrigin();
      if (fluid) fluid.realloc();
      if (reduceMotion) drawGL(1.2, true, 0);
    }

    function ensureRunning() {
      if (document.hidden) return;
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      resize();
      if (reduceMotion) { drawGL(1.2, true, 0); return; }
      resumed = true;
      if (fluid) fluid.queue.length = 0;   // drop stale splats queued at tab-away
      raf = requestAnimationFrame(frame);
    }

    /* the pointer stirs the liquid (fluid) / seeds ripples (fallback) */
    function onMouseMove(e) {
      if (Date.now() - touchTime < 700) return;   // ghost mouse after touch
      if (fluid) pushForce(e.clientX, e.clientY);
      else spawnTrail(e.clientX, e.clientY);
    }
    // Touch equivalent of :hover — fill the button under the finger
    function highlightButtonAt(x, y) {
      var el = document.elementFromPoint(x, y);
      var btn = el && el.closest ? el.closest(".social-button") : null;
      for (var b = 0; b < buttons.length; b++) {
        buttons[b].classList.toggle("is-active", buttons[b] === btn);
      }
    }
    function onTouchStart(e) {
      touchTime = Date.now();
      var t = e.touches && e.touches[0];
      if (!t) return;
      pmx = -1e5; pmy = -1e5;
      lastSX = -1e5; lastSY = -1e5;
      if (fluid) pushForce(t.clientX, t.clientY);
      else spawnTrail(t.clientX, t.clientY);
      highlightButtonAt(t.clientX, t.clientY);
    }
    function onTouchMove(e) {
      touchTime = Date.now();
      var t = e.touches && e.touches[0];
      if (!t) return;
      if (fluid) pushForce(t.clientX, t.clientY);
      else spawnTrail(t.clientX, t.clientY);
      highlightButtonAt(t.clientX, t.clientY);
    }
    function clearTouch() {
      touchTime = Date.now();
      pmx = -1e5; pmy = -1e5;
      for (var b = 0; b < buttons.length; b++) buttons[b].classList.remove("is-active");
    }

    if (!reduceMotion) {
      window.addEventListener("mousemove", onMouseMove, { passive: true });
      window.addEventListener("touchstart", onTouchStart, { passive: true });
      window.addEventListener("touchmove", onTouchMove, { passive: true });
      window.addEventListener("touchend", clearTouch, { passive: true });
      window.addEventListener("touchcancel", clearTouch, { passive: true });
      document.documentElement.addEventListener("mouseleave", function () {
        pressTarget = 0;
        pmx = -1e5; pmy = -1e5;
      });
      window.addEventListener("blur", function () {
        pressTarget = 0;
        pmx = -1e5; pmy = -1e5;
      });
    }

    /* press -> release -> ripple in the background field */
    if (avatarEl) {
      var hoverAt = 0;
      avatarEl.addEventListener("mouseenter", function () {
        if (Date.now() - touchTime < 700) return;
        hoverAt = Date.now();
        if (!reduceMotion) pressTarget = 1;
      });
      avatarEl.addEventListener("mouseleave", function () {
        if (Date.now() - touchTime < 700) return;
        pressTarget = 0;
        /* the wave is the release of a felt press — fast pass-throughs on
           the way to the buttons (or synthetic leave events on tab switch)
           should not fire it */
        if (Date.now() - hoverAt < 180 || document.hidden) return;
        burst();
      });
      // No sustained hover on touch — a tap is press + release in one
      avatarEl.addEventListener("touchstart", burst, { passive: true });
    }

    window.addEventListener("resize", resize, { passive: true });
    window.addEventListener("load", updateOrigin);

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      } else {
        ensureRunning();
      }
    });
    window.addEventListener("pageshow", ensureRunning);
    window.addEventListener("focus", ensureRunning);
    cv.addEventListener("webglcontextlost", function (e) {
      e.preventDefault();
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    });
    cv.addEventListener("webglcontextrestored", function () {
      if (initGL()) {
        if (!reduceMotion) fluid = initFluid();
        ensureRunning();
      }
    });

    // React to motion-preference changes live
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
      var onMq = function () {
        reduceMotion = mq.matches;
        if (reduceMotion) {
          if (raf) { cancelAnimationFrame(raf); raf = null; }
          press = 0; pressTarget = 0; rip = [];
          drawGL(1.2, true, 0);
        } else if (!raf) {
          if (!fluid) fluid = initFluid();
          start = 0;
          raf = requestAnimationFrame(frame);
        }
      };
      if (mq.addEventListener) mq.addEventListener("change", onMq);
      else if (mq.addListener) mq.addListener(onMq);
    }

    // Boot
    resize();
    if (reduceMotion) {
      drawGL(1.2, true, 0);
    } else {
      raf = requestAnimationFrame(frame);
    }
  })();
  </script>
</body>
</html>
